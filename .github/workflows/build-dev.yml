name: Build (Dev, unsigned)

# Builds the Dev configuration unsigned and asserts its identity, and runs the Core Data
# migration tests on a simulator. Neither job needs signing material.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
      - 'chore/sync-upstream-**'

concurrency:
  group: build-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      RUN_IN_CI: 'true'   # the project's "Copy GoogleService-Info" build phase skips when set
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4.1'

      - name: Provide GoogleService-Info.plist (.dev Firebase app)
        env:
          GS_B64: ${{ secrets.GOOGLESERVICE_INFO_PLIST_DEVNET_BASE64 }}
        run: echo "$GS_B64" | base64 --decode > polkadot-app/GoogleService-Info.plist

      # The in-Xcode "Generate Secrets" phase skips when RUN_IN_CI=true, so CI runs it here.
      - name: Generate build-time secrets
        run: ./Runscripts/generate_secrets.sh

      - name: Resolve SwiftPM dependencies
        run: xcodebuild -resolvePackageDependencies -project polkadot-app.xcodeproj -scheme polkadot-app

      # brand.xcconfig keeps upstream's identity, so a sync that drops the Dev overrides would still build.
      - name: Verify the Dev lane's pinned identity
        run: |
          set -o pipefail
          xcodebuild \
            -project polkadot-app.xcodeproj \
            -scheme polkadot-app \
            -configuration Dev \
            -showBuildSettings 2>/dev/null | sed -e 's/^[[:space:]]*//' > build-settings.txt

          fail=0
          expect() {
            if grep -qxF "$1" build-settings.txt; then
              echo "ok: $1"
            else
              echo "::error::expected build setting not found: $1"
              grep -E "^${1%% =*} = " build-settings.txt || echo "  (setting absent entirely)"
              fail=1
            fi
          }

          expect "APP_MAIN_BUNDLE = io.pcf.polkadotapp.devnet"
          expect "BUNDLE = io.pcf.polkadotapp.devnet"
          expect "PRODUCT_BUNDLE_IDENTIFIER = io.pcf.polkadotapp.devnet"
          expect "APP_GROUP = group.pcf.polkadotapp.devnet"

          # base.release.xcconfig leaves ICON_SUFFIX empty, so the Dev leaf must set it.
          expect "ICON_SUFFIX = Dev"
          expect "ASSETCATALOG_COMPILER_APPICON_NAME = AppIconDev"

          # An empty DEEPLINK silently drops the custom URL scheme from Info.plist.
          if grep -qxE "DEEPLINK = .+" build-settings.txt; then
            echo "ok: $(grep -m1 -xE 'DEEPLINK = .+' build-settings.txt)"
          else
            echo "::error::DEEPLINK is empty or unset for the Dev configuration"
            fail=1
          fi

          # Nothing on the Dev lane may ship under Parity's bundle identifier.
          if grep -qE "^PRODUCT_BUNDLE_IDENTIFIER = io\.parity\." build-settings.txt; then
            echo "::error::a target on the Dev lane still uses a Parity bundle identifier"
            grep -E "^PRODUCT_BUNDLE_IDENTIFIER = " build-settings.txt
            fail=1
          fi

          exit $fail

      - name: Build (Dev, no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project polkadot-app.xcodeproj \
            -scheme polkadot-app \
            -configuration Dev \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # Diagnostic only: publishes the compiled icon, which -showBuildSettings cannot show.
      - name: Extract the compiled app icon
        if: always()
        continue-on-error: true
        run: |
          set +e
          mkdir -p icon-evidence

          app=$(find ~/Library/Developer/Xcode/DerivedData \
            -path '*/Build/Products/Dev-iphoneos/polkadot-app.app' -type d 2>/dev/null | head -1)
          if [ -z "$app" ]; then
            app=$(find ~/Library/Developer/Xcode/DerivedData \
              -name 'polkadot-app.app' -type d 2>/dev/null | head -1)
          fi
          if [ -z "$app" ]; then
            echo "no built polkadot-app.app found"
            exit 0
          fi
          echo "app bundle: $app"

          # Which icon name did the build bake into Info.plist / the asset catalog?
          plutil -p "$app/Info.plist" 2>/dev/null \
            | grep -iE 'icon' > icon-evidence/info-plist-icon-keys.txt
          cat icon-evidence/info-plist-icon-keys.txt

          # Loose icon files actool writes at the bundle root, plus anything .icon-shaped.
          find "$app" -maxdepth 2 \( -iname '*icon*' \) -print > icon-evidence/bundle-icon-files.txt
          cat icon-evidence/bundle-icon-files.txt

          find "$app" -maxdepth 2 -iname 'AppIcon*.png' -exec cp {} icon-evidence/ \; 2>/dev/null

          # The rendered artwork lives in Assets.car: extract every AppIcon rendition.
          if [ -f "$app/Assets.car" ]; then
            xcrun assetutil --info "$app/Assets.car" > icon-evidence/assets-car-info.json 2>&1
            grep -iE '"Name"|"Image Type"|AppIcon' icon-evidence/assets-car-info.json \
              | sort -u | head -60
          fi

          echo "--- collected ---"
          ls -la icon-evidence/

      - name: Upload icon evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dev-icon-evidence
          path: icon-evidence
          retention-days: 7
          if-no-files-found: warn

  # Runs the Core Data migration from v36, the model older installs carry, on a simulator.
  storage-migration-tests:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      RUN_IN_CI: 'true'
    steps:
      - uses: actions/checkout@v4

      # Matches upstream's test toolchain (.github/actions/install).
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4.1'

      - name: Provide GoogleService-Info.plist (.dev Firebase app)
        env:
          GS_B64: ${{ secrets.GOOGLESERVICE_INFO_PLIST_DEV_BASE64 }}
        run: echo "$GS_B64" | base64 --decode > polkadot-app/GoogleService-Info.plist

      - name: Generate build-time secrets
        run: ./Runscripts/generate_secrets.sh

      - name: Resolve SwiftPM dependencies
        run: xcodebuild -resolvePackageDependencies -project polkadot-app.xcodeproj -scheme polkadot-app

      # Runner images change their installed simulators between releases, so resolve one rather
      # than pinning a device name that silently disappears.
      - name: Pick a simulator
        id: sim
        run: |
          set -o pipefail
          # "    iPhone 16 (UDID) (Shutdown)" -> UDID. Only the UUID matches the 36-char group,
          # so the trailing "(Shutdown)" cannot be picked up by mistake.
          udid=$(xcrun simctl list devices available \
            | grep -E '^[[:space:]]+iPhone' \
            | head -1 \
            | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$udid" ]; then
            echo "::error::no available iPhone simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"

      # Only the migration suites run here. No -configuration override: Dev builds
      # without testability, and the scheme's Debug configuration has it.
      - name: Test (user store v36 migration)
        run: |
          set -o pipefail
          rm -rf TestResults.xcresult
          xcodebuild \
            -project polkadot-app.xcodeproj \
            -scheme polkadot-appTests \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:polkadot-appTests/UserStorageMigrationV36Tests \
            -only-testing:polkadot-appTests/UserStorageMigratorTests \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test 2>&1 | tee xcodebuild-test.log

      # A filter that matches nothing passes with zero tests, so every suite in REQUIRED_SUITES must
      # appear by name in the result bundle (the console format is not stable).
      - name: Assert the tests actually executed
        env:
          REQUIRED_SUITES: UserStorageMigrationV36Tests
        run: |
          set -o pipefail

          if [ ! -d TestResults.xcresult ]; then
            echo "::error::no result bundle was produced — the test step did not run tests"
            exit 1
          fi

          xcrun xcresulttool get test-results summary \
            --path TestResults.xcresult --format json > test-summary.json
          xcrun xcresulttool get test-results tests \
            --path TestResults.xcresult --format json > test-tree.json

          python3 - <<'PY'
          import json, os, sys

          summary = json.load(open("test-summary.json"))

          if "totalTestCount" not in summary:
              print("::error::unexpected xcresulttool summary shape; raw payload follows")
              print(json.dumps(summary, indent=2)[:4000])
              sys.exit(1)

          total = summary.get("totalTestCount", 0)
          passed = summary.get("passedTests", 0)
          failed = summary.get("failedTests", 0)
          skipped = summary.get("skippedTests", 0)

          print(f"result: {summary.get('result')}  total={total} passed={passed} "
                f"failed={failed} skipped={skipped}")

          for case in summary.get("testFailures", []):
              print(f"  FAILED {case.get('testName')}: {case.get('failureText')}")

          if total == 0:
              print("::error::no tests executed - the -only-testing filters matched nothing, "
                    "or the test classes are not in the polkadot-appTests target")
              sys.exit(1)

          if passed == 0:
              print("::error::no tests passed")
              sys.exit(1)

          # Walk the result tree schema-agnostically: collect every string value stored under a
          # name-ish key, at any depth, so this survives xcresulttool changing its shape.
          names = set()

          def walk(node):
              if isinstance(node, dict):
                  for key, value in node.items():
                      if key in ("name", "nodeIdentifier", "identifier") and isinstance(value, str):
                          names.add(value)
                      walk(value)
              elif isinstance(node, list):
                  for item in node:
                      walk(item)

          walk(json.load(open("test-tree.json")))

          missing = [
              suite for suite in os.environ["REQUIRED_SUITES"].split()
              if not any(suite in name for name in names)
          ]

          if missing:
              print(f"::error::these suites did not execute: {', '.join(missing)}")
              print("suites seen in the result bundle:")
              for name in sorted(n for n in names if n.endswith("Tests")):
                  print(f"  {name}")
              sys.exit(1)

          print(f"::notice::{passed} of {total} tests executed and passed "
                f"({os.environ['REQUIRED_SUITES']})")
          PY

      # Diagnostic only: lists the test classes in the built bundle.
      - name: Diagnose the built test bundle
        if: always()
        run: |
          bundle=$(find ~/Library/Developer/Xcode/DerivedData \
            -name 'polkadot-appTests.xctest' -type d 2>/dev/null | head -1)

          if [ -z "$bundle" ]; then
            echo "no polkadot-appTests.xctest bundle was produced"
            exit 0
          fi

          echo "bundle: $bundle"
          binary="$bundle/polkadot-appTests"

          if [ ! -f "$binary" ]; then
            echo "no executable inside the bundle"
            ls -la "$bundle"
            exit 0
          fi

          echo "--- XCTestCase subclasses found in the binary ---"
          nm -gU "$binary" 2>/dev/null | grep -oE '[A-Za-z_]*Tests' | sort -u | head -50

          echo "--- is UserStorageMigrationV36Tests present? ---"
          if nm -gU "$binary" 2>/dev/null | grep -q 'UserStorageMigrationV36Tests'; then
            echo "YES - the class is in the test bundle"
          else
            echo "NO - the class is NOT in the test bundle (synchronized group did not pick it up)"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-migration-test-results
          path: |
            TestResults.xcresult
            xcodebuild-test.log
          retention-days: 7
          if-no-files-found: warn
