name: Build (Dev, unsigned)

# The fork's own gate for the Dev configuration. Two jobs, running in parallel:
#
#   build                    - compiles the app and its embedded NotificationServiceExtension for
#                              a generic iOS device WITHOUT code signing, so it needs no Apple
#                              Developer portal registration, no provisioning profile and no App
#                              Store Connect API key. Catches Swift compile errors behind the
#                              -DDEV flag (`#elseif NIGHTLY || DEV` gates), pbxproj configuration
#                              mistakes in the Dev build configuration, and SwiftPM resolution
#                              failures before the signed TestFlight lane (release-dev.yml) is
#                              exercised. It also asserts the Dev lane's pinned PCF identity.
#   storage-migration-tests  - the only lane in this repo that EXECUTES code. Runs the v36 -> v42
#                              Core Data migration on a simulator. Upstream's 0.10.0 squash
#                              deleted models 1...36 while every pre-squash PCF install is at v36,
#                              so this upgrade path is the fork's highest-consequence claim and
#                              the one that source review cannot settle.
#
# Neither job needs Parity's signing material, which is what makes them runnable on this fork at
# all — upstream's pr.yml cannot pass here (it wants secrets.FASTLANE_RO_PAT for Parity's Match
# repo and a GoogleService-Info.plist pinned to io.parity.polkadotapp.develop).
#
# Required repository secrets (already used by release-dev.yml):
#   GOOGLESERVICE_INFO_PLIST_DEV_BASE64  base64 of the .dev Firebase app's GoogleService-Info.plist
#
# W3S_AUTH_KEY is no longer used — see release-dev.yml.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: build-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      RUN_IN_CI: 'true'   # the project's "Copy GoogleService-Info" build phase skips when set
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Provide GoogleService-Info.plist (.dev Firebase app)
        env:
          GS_B64: ${{ secrets.GOOGLESERVICE_INFO_PLIST_DEV_BASE64 }}
        run: echo "$GS_B64" | base64 --decode > polkadot-app/GoogleService-Info.plist

      # Upstream replaced Scripts/inject-keys.sh with Runscripts/generate_secrets.sh.
      # The in-Xcode "Generate Secrets" phase skips when RUN_IN_CI=true, so CI runs it here.
      - name: Generate build-time secrets
        run: ./Runscripts/generate_secrets.sh

      - name: Resolve SwiftPM dependencies
        run: xcodebuild -resolvePackageDependencies -project polkadot-app.xcodeproj -scheme polkadot-app

      # The fork's whole reason for existing on this lane is that the Dev configuration is pinned
      # to PCF's own identity. Configs/brand.xcconfig is deliberately kept byte-identical to
      # upstream (so it never conflicts on a sync), which means BRAND_BUNDLE_ROOT is still
      # io.parity.polkadotapp and the pinning in polkadot-app/Configs/polkadot-app.dev.xcconfig is
      # the only thing overriding it. A sync that silently drops that override would still build,
      # still pass every other check, and ship under Parity's identity into Parity's App Group.
      # Assert it instead of trusting it.
      - name: Verify the Dev lane's pinned identity
        run: |
          set -o pipefail
          xcodebuild \
            -project polkadot-app.xcodeproj \
            -scheme polkadot-app \
            -configuration Dev \
            -showBuildSettings 2>/dev/null | sed -e 's/^[[:space:]]*//' > build-settings.txt

          fail=0
          expect() {
            if grep -qxF "$1" build-settings.txt; then
              echo "ok: $1"
            else
              echo "::error::expected build setting not found: $1"
              grep -E "^${1%% =*} = " build-settings.txt || echo "  (setting absent entirely)"
              fail=1
            fi
          }

          expect "APP_MAIN_BUNDLE = io.pcf.polkadotapp"
          expect "BUNDLE = io.pcf.polkadotapp"
          expect "PRODUCT_BUNDLE_IDENTIFIER = io.pcf.polkadotapp"
          expect "APP_GROUP = group.pcf.polkadotapp"

          # DEEPLINK is derived from BRAND_DEEPLINK by upstream's 4c1a647 refactor. An empty value
          # here flows into Info.plist's CFBundleURLSchemes and silently kills the custom scheme.
          if grep -qxE "DEEPLINK = .+" build-settings.txt; then
            echo "ok: $(grep -m1 -xE 'DEEPLINK = .+' build-settings.txt)"
          else
            echo "::error::DEEPLINK is empty or unset for the Dev configuration"
            fail=1
          fi

          # Nothing on the Dev lane may ship under Parity's bundle identifier.
          if grep -qE "^PRODUCT_BUNDLE_IDENTIFIER = io\.parity\." build-settings.txt; then
            echo "::error::a target on the Dev lane still uses a Parity bundle identifier"
            grep -E "^PRODUCT_BUNDLE_IDENTIFIER = " build-settings.txt
            fail=1
          fi

          exit $fail

      - name: Build (Dev, no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project polkadot-app.xcodeproj \
            -scheme polkadot-app \
            -configuration Dev \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

  # Runs in parallel with `build`: that lane targets a generic device, this one a simulator, so
  # there is no shared derived data to reuse and serialising them would only add wall clock.
  #
  # This is the only lane in the repo that EXECUTES anything. `build` proves the code compiles;
  # this proves the v36 -> v42 Core Data migration actually works, which is the fork's central
  # claim about the upgrade path and cannot be established by reading source.
  storage-migration-tests:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      RUN_IN_CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Provide GoogleService-Info.plist (.dev Firebase app)
        env:
          GS_B64: ${{ secrets.GOOGLESERVICE_INFO_PLIST_DEV_BASE64 }}
        run: echo "$GS_B64" | base64 --decode > polkadot-app/GoogleService-Info.plist

      - name: Generate build-time secrets
        run: ./Runscripts/generate_secrets.sh

      - name: Resolve SwiftPM dependencies
        run: xcodebuild -resolvePackageDependencies -project polkadot-app.xcodeproj -scheme polkadot-app

      # Runner images change their installed simulators between releases, so resolve one rather
      # than pinning a device name that silently disappears.
      - name: Pick a simulator
        id: sim
        run: |
          set -o pipefail
          # "    iPhone 16 (UDID) (Shutdown)" -> UDID. Only the UUID matches the 36-char group,
          # so the trailing "(Shutdown)" cannot be picked up by mistake.
          udid=$(xcrun simctl list devices available \
            | grep -E '^[[:space:]]+iPhone' \
            | head -1 \
            | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$udid" ]; then
            echo "::error::no available iPhone simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"

      # Scoped to the migration tests on purpose. The rest of the suite has never run in CI, so
      # adopting it wholesale here would make this lane red for reasons unrelated to the upgrade
      # path it is meant to guard. Widen once the suite is known green.
      #
      # No -configuration override: the Dev configuration builds without testability, so
      # `@testable import polkadot_app` fails to compile. The polkadot-appTests scheme's own Debug
      # configuration has ENABLE_TESTABILITY, and the Core Data models are identical across
      # configurations, so nothing under test is configuration-specific.
      - name: Test (user store v36 migration)
        run: |
          set -o pipefail
          xcodebuild \
            -project polkadot-app.xcodeproj \
            -scheme polkadot-appTests \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:polkadot-appTests/UserStorageMigrationV36Tests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test 2>&1 | tee xcodebuild-test.log

      # An -only-testing: filter that matches nothing passes VACUOUSLY: xcodebuild reports
      # ** TEST SUCCEEDED ** having run zero tests. A renamed or unregistered test class would
      # therefore turn this lane into a permanent false green, which is worse than not having it.
      # Require positive evidence that tests actually executed.
      - name: Assert the tests actually executed
        run: |
          if ! grep -qE "Executed [1-9][0-9]* test" xcodebuild-test.log; then
            echo "::error::no tests executed — the -only-testing filter matched nothing, or the test class is not in the target"
            grep -E "Test Suite|Executed .* test|TEST SUCCEEDED|TEST FAILED" xcodebuild-test.log || true
            exit 1
          fi
          grep -E "Test Case .* (passed|failed)|Executed [0-9]+ test" xcodebuild-test.log
