name: Build (Dev, unsigned)

# Compile-only lane for the Dev configuration: builds the app (and its embedded
# NotificationServiceExtension) for a generic iOS device WITHOUT code signing, so it
# needs no Apple Developer portal registration, no provisioning profile and no App
# Store Connect API key. Its job is to catch build-process issues early — Swift
# compile errors behind the -DDEV flag (`#elseif NIGHTLY || DEV` gates), pbxproj
# configuration mistakes in the Dev build configuration, SwiftPM resolution — before
# the signed TestFlight lane (release-dev.yml) is exercised.
#
# Required repository secrets (already used by release-dev.yml):
#   GOOGLESERVICE_INFO_PLIST_DEV_BASE64  base64 of the .dev Firebase app's GoogleService-Info.plist
#   W3S_AUTH_KEY                         auth keypair seed (hex); optional for compiling —
#                                        inject-keys.sh falls back to an empty value.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: build-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      RUN_IN_CI: 'true'   # the project's "Copy GoogleService-Info" build phase skips when set
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Provide GoogleService-Info.plist (.dev Firebase app)
        env:
          GS_B64: ${{ secrets.GOOGLESERVICE_INFO_PLIST_DEV_BASE64 }}
        run: echo "$GS_B64" | base64 --decode > polkadot-app/GoogleService-Info.plist

      - name: Generate build-time config (CIKeys)
        env:
          W3S_AUTH_KEY: ${{ secrets.W3S_AUTH_KEY }}
        run: ./Scripts/inject-keys.sh

      - name: Resolve SwiftPM dependencies
        run: xcodebuild -resolvePackageDependencies -project polkadot-app.xcodeproj -scheme polkadot-app

      - name: Build (Dev, no code signing)
        env:
          # The scheme pre-action re-runs Scripts/inject-keys.sh on every build, so
          # W3S_AUTH_KEY must be in scope here too or CIKeys.generated.swift is rewritten
          # with an empty seed (keeps this lane consistent with release-dev.yml).
          W3S_AUTH_KEY: ${{ secrets.W3S_AUTH_KEY }}
        run: |
          set -o pipefail
          xcodebuild \
            -project polkadot-app.xcodeproj \
            -scheme polkadot-app \
            -configuration Dev \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

  # Runs in parallel with `build`: that lane targets a generic device, this one a simulator,
  # so there is no shared derived data to reuse and serialising them would only add wall clock.
  storage-migration-tests:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      RUN_IN_CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Provide GoogleService-Info.plist (.dev Firebase app)
        env:
          GS_B64: ${{ secrets.GOOGLESERVICE_INFO_PLIST_DEV_BASE64 }}
        run: echo "$GS_B64" | base64 --decode > polkadot-app/GoogleService-Info.plist

      - name: Generate build-time config (CIKeys)
        env:
          W3S_AUTH_KEY: ${{ secrets.W3S_AUTH_KEY }}
        run: ./Scripts/inject-keys.sh

      - name: Resolve SwiftPM dependencies
        run: xcodebuild -resolvePackageDependencies -project polkadot-app.xcodeproj -scheme polkadot-app

      # Runner images change their installed simulators between releases, so resolve one
      # rather than pinning a device name that silently disappears.
      - name: Pick a simulator
        id: sim
        run: |
          set -o pipefail
          # "    iPhone 16 (UDID) (Shutdown)" -> UDID. Only the UUID matches the 36-char
          # group, so the trailing "(Shutdown)" cannot be picked up by mistake.
          udid=$(xcrun simctl list devices available \
            | grep -E '^[[:space:]]+iPhone' \
            | head -1 \
            | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$udid" ]; then
            echo "no available iPhone simulator on this runner" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"

      # Scoped to the migration tests on purpose. The rest of the suite has never run in CI,
      # so adopting it wholesale here would make this lane red for reasons unrelated to the
      # upgrade path it is meant to guard. Widen once the suite is known green.
      - name: Test (user store migration)
        env:
          W3S_AUTH_KEY: ${{ secrets.W3S_AUTH_KEY }}
        run: |
          set -o pipefail
          # No -configuration override: the Dev configuration builds without testability, so
          # `@testable import polkadot_app` fails to compile. The scheme's own Debug
          # configuration has ENABLE_TESTABILITY, and the migrator and the Core Data model are
          # identical across configurations, so nothing under test is configuration-specific.
          xcodebuild \
            -project polkadot-app.xcodeproj \
            -scheme polkadot-appTests \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:polkadot-appTests/UserStorageMigratorTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test
