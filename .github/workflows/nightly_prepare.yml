name: Prepare Nightly

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# PCF production branch: upstream workflow kept with ONLY the workflow_dispatch trigger (upstream's
# pull_request / schedule triggers removed) so nothing publishes or mutates the repository unattended.
# The jobs are upstream's, unchanged. Production builds come from build-production.yml.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source ref to create release branch from (existing branch name or commit SHA)"
        type: string
        required: false
        default: develop
      increment_step:
        description: "Build number increment step (1 if empty)"
        type: string
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  prepare:
    uses: ./.github/workflows/_prepare_pipeline.yml
    with:
      is_nightly: true
      bump_level: "no-bump"
      source_ref: ${{ inputs.source_ref || 'develop' }}
      increment_step: ${{ inputs.increment_step || '' }}
      distribution_workflow: nightly_distribution.yml
    secrets: inherit
