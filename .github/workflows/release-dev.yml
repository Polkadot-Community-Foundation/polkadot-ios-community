name: Release (Dev)

# Archives the polkadot-app iOS client in the DEV configuration and distributes it to the
# external TestFlight group named by the TESTFLIGHT_GROUP variable. The Dev build is the
# PUBLIC developer build: it MIRRORS Nightly's testnet contour via its own dedicated flag (it
# carries -DDEV / -DTESTNET_FEATURE plus the FEATURE_* set named in polkadot-app/Configs/polkadot-app.dev.xcconfig
# — upstream retired -DW3S — and every network gate is `#elseif NIGHTLY || DEV`, so it reads
# `chains_v2`, resolving chains by the fixed ids nightly-relay / nightly-ah / nightly-people /
# nightly-bulletin in KnownChains.swift). It ships under its own bundle id
# io.pcf.polkadotapp.devnet, with its own App Store Connect record, TestFlight group, App Group
# and keychain group. Remote Config serves it through the `dev_build_ios` condition, matched on
# its Firebase app id and the `build_channel=dev` custom signal set by
# FirebaseApplicationService. Network wiring is delivered at runtime from Firebase Remote Config
# (chains_v2 / dot_ns_config / ipfs_gateway_url / identity_backend_url) in the Firebase
# project whose GoogleService-Info plist you supply below.
#
# Build numbers are stamped from the CI run number (CURRENT_PROJECT_VERSION) so repeated
# uploads of the same marketing version are accepted. The first build of each version sent
# to the external group goes through Beta App Review before testers receive it.
#
# Lanes: a dispatch on the `devnet` branch is a release. It builds in the `devnet` environment,
# tags the built commit `devnet/<YYYY-MM-DD>.<n>`, and hands the build to testers behind
# `tester-distribution`. A dispatch on any other branch only uploads the signed .ipa as a run
# artifact: no tag, no TestFlight upload, no release record.
#
# ⭐ This workflow MUST NOT bump MARKETING_VERSION. Only CURRENT_PROJECT_VERSION (the build
# number) is stamped, from the CI run number; MARKETING_VERSION stays wherever
# polkadot-app.xcodeproj/project.pbxproj has it and is bumped by hand, on purpose. That lets
# each devnet release reuse an already-approved version and reach testers immediately — the
# first build of a NEW version goes through Beta App Review and can lag a day.
#
# Required secrets (environment `devnet`; repository level is the fallback):
#   APP_STORE_CONNECT_KEY_ID             App Store Connect API key id (.p8 key; needs the
#                                        App Manager role to manage TestFlight groups)
#   APP_STORE_CONNECT_ISSUER_ID          API issuer id
#   APP_STORE_CONNECT_KEY_CONTENT        base64 of the .p8 private key
#   APPLE_TEAM_ID                        Developer team id (for signing + ExportOptions)
#   GOOGLESERVICE_INFO_PLIST_DEVNET_BASE64  base64 of the GoogleService-Info.plist of the
#                                           io.pcf.polkadotapp.devnet Firebase iOS app
# Optional: SENTRY_DSN/SENTRY_ORG/SENTRY_PROJECT/SENTRY_AUTH_TOKEN, MELD_BASIC_AUTH_TOKEN.
#
# W3S_AUTH_KEY is NO LONGER USED. Upstream deleted W3SAuthorizedSigner and the
# ValueTransferAuthPallet signing protocol it implemented; W3S statements are now signed with
# the user's own wallet key. The repository secret can be revoked once this lands.
# Optional repository variable:
#   TESTFLIGHT_JOIN_URL  Public join link shown in the GitHub release body (falls back to the
#                        hardcoded link if unset).
#   TESTFLIGHT_GROUP     External TestFlight group name (default "Polkadot Devnet Testers").

on:
  workflow_dispatch:

permissions:
  contents: read

# One release run at a time. Don't cancel an in-progress run: a half-finished TestFlight
# upload should complete rather than abort.
concurrency:
  group: release-dev
  cancel-in-progress: false

jobs:
  # Builds and signs the .ipa. Handing it to testers is `distribute` below, behind a
  # required-reviewer approval.
  testflight:
    runs-on: macos-26
    environment: devnet
    env:
      RUN_IN_CI: 'true'   # the project's "Copy GoogleService-Info" build phase skips when set
    steps:
      - name: Record the signing start
        run: echo "SIGN_STARTED=$(date -u +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4.1'

      - name: Provide GoogleService-Info.plist (.dev Firebase app)
        env:
          GS_B64: ${{ secrets.GOOGLESERVICE_INFO_PLIST_DEVNET_BASE64 }}
        run: echo "$GS_B64" | base64 --decode > polkadot-app/GoogleService-Info.plist

      # Upstream replaced Scripts/inject-keys.sh (CIKeys.generated.swift) with
      # Runscripts/generate_secrets.sh (Secrets.generated.swift). The in-Xcode "Generate
      # Secrets" build phase skips when RUN_IN_CI=true, so CI must run it here.
      # W3S_AUTH_KEY is deliberately NOT passed: upstream deleted W3SAuthorizedSigner and
      # now signs W3S statements with the user's own wallet key, so the seed has no consumer.
      - name: Generate build-time secrets
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          MELD_BASIC_AUTH_TOKEN: ${{ secrets.MELD_BASIC_AUTH_TOKEN }}
        run: ./Runscripts/generate_secrets.sh

      - name: Install App Store Connect API key
        id: asc
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          mkdir -p ./private_keys ~/.appstoreconnect/private_keys
          echo "$KEY_B64" | base64 --decode > "./private_keys/AuthKey_${KEY_ID}.p8"
          cp "./private_keys/AuthKey_${KEY_ID}.p8" ~/.appstoreconnect/private_keys/
          echo "key_path=$PWD/private_keys/AuthKey_${KEY_ID}.p8" >> "$GITHUB_OUTPUT"

      # Isolated venv: the runner's Homebrew python refuses a global pip install.
      # Hashed lock, wheels only: nothing unpinned or built from source runs beside the key.
      - name: Install App Store Connect tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/ascenv"
          "$RUNNER_TEMP/ascenv/bin/pip" install --quiet --require-hashes --no-deps --only-binary :all: \
            -r .github/scripts/requirements-asc.txt

      - name: Resolve SwiftPM dependencies
        run: xcodebuild -resolvePackageDependencies -project polkadot-app.xcodeproj -scheme polkadot-app

      - name: Write ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF

      - name: Archive (Dev)
        env:
          # The scheme pre-action and the "Generate Secrets" build phase both re-run
          # Runscripts/generate_secrets.sh, but both no-op while RUN_IN_CI=true, so the
          # file written by the step above survives. Values still passed for the case
          # where that guard is ever lifted.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          MELD_BASIC_AUTH_TOKEN: ${{ secrets.MELD_BASIC_AUTH_TOKEN }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild \
            -project polkadot-app.xcodeproj \
            -scheme polkadot-app \
            -configuration Dev \
            -archivePath build/polkadot-app.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.asc.outputs.key_path }}" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      - name: Export signed .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath build/polkadot-app.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.asc.outputs.key_path }}" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: polkadot-ios-dev
          path: build/*.ipa
          if-no-files-found: warn

      # Automatic signing on a fresh runner creates a certificate every run; revoke the ones
      # this runner created so the team account never fills up. Runs even when signing failed.
      - name: Revoke certificates created by this runner
        if: always()
        timeout-minutes: 10
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          [ -x "$RUNNER_TEMP/ascenv/bin/python" ] || { echo "tooling was never installed; nothing to revoke"; exit 0; }
          "$RUNNER_TEMP/ascenv/bin/python" .github/scripts/asc_signing.py revoke-runner-certs

      # Alternative distribution (instead of TestFlight): build an `ad-hoc` ipa
      # (ExportOptions method=ad-hoc) and run
      #   firebase appdistribution:distribute build/polkadot-app.ipa \
      #     --app "$FIREBASE_APP_ID" --groups "$FIREBASE_GROUPS"
      # authenticated via a service account with Firebase App Distribution Admin.
      # The .dev Firebase app id is 1:165923692956:ios:3d940e376173f34bd72859.

  # ---- Tag — devnet branch only -----------------------------------------------------------
  # The build creates the tag: every devnet release tags the commit it built, before the
  # approval gate below, so a rejected hand-off still records what was built.
  tag:
    needs: testflight
    if: github.ref == 'refs/heads/devnet'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag the built commit
        id: tag
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          LAST=$(git ls-remote --tags origin "refs/tags/devnet/${DATE}.*" \
            | sed -n "s#.*refs/tags/devnet/${DATE}\.\([0-9]*\)\$#\1#p" | sort -n | tail -1)
          TAG="devnet/${DATE}.$(( ${LAST:-0} + 1 ))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "iOS devnet build ${GITHUB_RUN_NUMBER} (run ${GITHUB_RUN_ID})"
          git push origin "refs/tags/$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "### Tagged \`$TAG\` at ${GITHUB_SHA:0:8}" >> "$GITHUB_STEP_SUMMARY"

  # ---- TestFlight distribution — MANUAL APPROVAL GATE --------------------------------
  # Separate job so it can sit behind the protected `tester-distribution` environment,
  # which carries a REQUIRED REVIEWER. Every push to the external devnet
  # TestFlight group waits for a human to approve it in the Actions UI — the same
  # shape as an npm publish approval.
  #
  # ⚠️ The gate lives in the ENVIRONMENT, not in this file. If `tester-distribution` does
  # not exist, GitHub auto-creates it UNPROTECTED on first use and this job runs straight
  # through. Configure it under Settings → Environments → required reviewers.
  distribute:
    needs: [testflight, tag]
    if: github.ref == 'refs/heads/devnet'
    runs-on: macos-26
    permissions:
      contents: write   # softprops/action-gh-release (release records) — the gate is the environment
    environment:
      name: tester-distribution
      url: ${{ vars.TESTFLIGHT_JOIN_URL || 'https://testflight.apple.com/join/HnBX59vz' }}
    steps:
      - name: Download the signed .ipa
        uses: actions/download-artifact@v4
        with:
          name: polkadot-ios-dev
          path: build

      - name: Install App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          mkdir -p ./private_keys ~/.appstoreconnect/private_keys
          echo "$KEY_B64" | base64 --decode > "./private_keys/AuthKey_${KEY_ID}.p8"
          cp "./private_keys/AuthKey_${KEY_ID}.p8" ~/.appstoreconnect/private_keys/

      - name: Distribute to the external TestFlight group

        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          # Read from the environment, never interpolated into the script body.
          TAG: ${{ needs.tag.outputs.tag }}
          TF_GROUP: ${{ vars.TESTFLIGHT_GROUP || 'Polkadot Devnet Testers' }}
        run: |
          CHANGELOG="Devnet build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA:0:7}): ${TAG}."
          IPA=$(find build -maxdepth 1 -name '*.ipa' | head -1)
          [ -n "$IPA" ] || { echo "::error::no .ipa in the build artifact"; exit 1; }
          echo "Uploading $IPA"
          jq -n \
            --arg key_id "$KEY_ID" \
            --arg issuer_id "$ISSUER_ID" \
            --arg key "$(cat "./private_keys/AuthKey_${KEY_ID}.p8")" \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: false}' \
            > asc_api_key.json
          fastlane pilot upload \
            --api_key_path asc_api_key.json \
            --ipa "$IPA" \
            --distribute_external true \
            --groups "$TF_GROUP" \
            --beta_app_description "Developer build of the Polkadot app against the Paseo products devnet." \
            --beta_app_feedback_email "alemart@polkadotcommunity.foundation" \
            --changelog "$CHANGELOG"

      # ---- GitHub release record — behind the SAME approval as the TestFlight hand-off ----
      # It carries no binary (TestFlight is the only channel) but it is a public, citable
      # record of tag ↔ commit ↔ build number.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: ${{ needs.tag.outputs.tag }}
          prerelease: true
          body: |
            iOS developer build for the products devnet.

            Commit ${{ github.sha }} · build ${{ github.run_number }}

            Distribution is TestFlight-only:

            👉 Join and install: ${{ vars.TESTFLIGHT_JOIN_URL || 'https://testflight.apple.com/join/HnBX59vz' }}

            This is a **devnet** build for testing only; state may be wiped. Found a
            problem? [Report it](https://github.com/Polkadot-Community-Foundation/products-devnet-issues/issues/new/choose).
