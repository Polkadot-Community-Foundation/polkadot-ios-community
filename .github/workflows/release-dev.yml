name: Release (Dev)

# Devnet iOS release. A dispatch on `devnet` archives the Dev configuration
# (io.pcf.polkadotapp.devnet), tags the commit `devnet/<YYYY-MM-DD>.<n>` and hands the build to the
# external TestFlight group behind `tester-distribution`. A dispatch on any other branch only
# uploads the signed .ipa as a run artifact.
# Only the build number is stamped, from the run number. MARKETING_VERSION is bumped by hand,
# because the first build of a new version waits for Beta App Review.
# Upstream's distribution, nightly and release workflows are deleted on purpose (they publish
# unattended or need Parity's credentials); do not restore them.

on:
  workflow_dispatch:

permissions:
  contents: read

# Never cancel: a half-finished TestFlight upload must complete.
concurrency:
  group: release-dev
  cancel-in-progress: false

jobs:
  # Builds and signs the .ipa; `distribute` hands it to testers.
  testflight:
    runs-on: macos-26
    environment: devnet
    env:
      RUN_IN_CI: 'true'   # the project's "Copy GoogleService-Info" build phase skips when set
      TRUAPI_CORE_VERSION: '0.26.0'
      TRUAPI_CORE_REVISION: e7ce413f6e851439b8d82767aebcfe3c33f2ebe8
    steps:
      - name: Record the signing start
        run: echo "SIGN_STARTED=$(date -u +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4.1'

      - name: Provide GoogleService-Info.plist (.dev Firebase app)
        env:
          GS_B64: ${{ secrets.GOOGLESERVICE_INFO_PLIST_DEVNET_BASE64 }}
        run: echo "$GS_B64" | base64 --decode > polkadot-app/GoogleService-Info.plist

      # The in-Xcode "Generate Secrets" phase skips when RUN_IN_CI=true, so CI runs it here.
      - name: Generate build-time secrets
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          MELD_BASIC_AUTH_TOKEN: ${{ secrets.MELD_BASIC_AUTH_TOKEN }}
        run: ./Runscripts/generate_secrets.sh

      - name: Install App Store Connect API key
        id: asc
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          mkdir -p ./private_keys ~/.appstoreconnect/private_keys
          echo "$KEY_B64" | base64 --decode > "./private_keys/AuthKey_${KEY_ID}.p8"
          cp "./private_keys/AuthKey_${KEY_ID}.p8" ~/.appstoreconnect/private_keys/
          echo "key_path=$PWD/private_keys/AuthKey_${KEY_ID}.p8" >> "$GITHUB_OUTPUT"

      # The lock holds wheels only, so the interpreter is pinned rather than taken from the image,
      # whose default python3 moves between image releases.
      - name: Select Python for the signing tooling
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      # Isolated venv, hashed lock, wheels only: nothing unpinned or built from source runs beside the key.
      - name: Install App Store Connect tooling
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          "$PYTHON" -m venv "$RUNNER_TEMP/ascenv"
          "$RUNNER_TEMP/ascenv/bin/pip" install --quiet --require-hashes --no-deps --only-binary :all: \
            -r .github/scripts/requirements-asc.txt

      - name: Resolve SwiftPM dependencies
        run: xcodebuild -resolvePackageDependencies -project polkadot-app.xcodeproj -scheme polkadot-app

      # The TrUAPI core is the prebuilt xcframework of the trinity-user-agents SwiftPM tag.
      # Trinity's Package.swift falls back to an older tag outside its monorepo, and without
      # -DTRUAPI_RUNTIME_DEFAULT the Dev build quietly defaults to the native runtime.
      - name: Verify the TrUAPI core pin and runtime default
        run: |
          set -o pipefail
          fail=0

          python3 - \
            polkadot-app.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            Packages/AppDependencies/Package.resolved <<'PY' || fail=1
          import json, os, sys

          want = {"version": os.environ["TRUAPI_CORE_VERSION"],
                  "revision": os.environ["TRUAPI_CORE_REVISION"]}
          status = 0
          for path in sys.argv[1:]:
              pins = [p for p in json.load(open(path))["pins"]
                      if p["identity"] == "trinity-user-agents"]
              got = {k: pins[0]["state"].get(k) for k in want} if len(pins) == 1 else None
              if got == want:
                  print(f"ok: {path} pins trinity-user-agents {want['version']} @ {want['revision']}")
              else:
                  print(f"::error::{path} pins trinity-user-agents at {got}, expected {want}")
                  status = 1
          sys.exit(status)
          PY

          xcodebuild \
            -project polkadot-app.xcodeproj \
            -scheme polkadot-app \
            -configuration Dev \
            -showBuildSettings 2>/dev/null | sed -e 's/^[[:space:]]*//' > build-settings.txt
          app_flags=$(awk '/^Build settings for action [a-z]+ and target /{target=$NF}
            target == "polkadot-app:" && /^OTHER_SWIFT_FLAGS = /' build-settings.txt)
          if printf '%s\n' "$app_flags" | grep -qE '(^| )"?-DTRUAPI_RUNTIME_DEFAULT"?( |$)'; then
            echo "ok: polkadot-app OTHER_SWIFT_FLAGS carries -DTRUAPI_RUNTIME_DEFAULT"
          else
            echo "::error::the Dev configuration of polkadot-app does not set -DTRUAPI_RUNTIME_DEFAULT (polkadot-app/Configs/polkadot-app.dev.xcconfig)"
            echo "  ${app_flags:-OTHER_SWIFT_FLAGS absent}"
            fail=1
          fi

          exit $fail

      - name: Write ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF

      - name: Archive (Dev)
        env:
          # Also passed here in case the RUN_IN_CI guard in generate_secrets.sh is ever lifted.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          MELD_BASIC_AUTH_TOKEN: ${{ secrets.MELD_BASIC_AUTH_TOKEN }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild \
            -project polkadot-app.xcodeproj \
            -scheme polkadot-app \
            -configuration Dev \
            -archivePath build/polkadot-app.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.asc.outputs.key_path }}" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      # Package.resolved proves what SwiftPM fetched; this proves what was linked. The core
      # markers are tracing span literals that first appear in the 0.26 core (truapi 0.26.0
      # rust/crates/truapi/src/host_core.rs).
      # The baseline marker is in every core since 0.16, so its absence means the scan itself is
      # broken, not the core old.
      # The wire schema hash is reported only: the core embeds it solely in the loopback debugger
      # sink, which no mobile FFI entry point reaches, so link-time optimisation may drop it.
      - name: Fingerprint the TrUAPI core in the archived app
        env:
          CORE_MARKERS: signing_host_runtime.set_payment_platform signing_host_runtime.set_balance_platform signing_host_runtime.set_top_up_platform
          BASELINE_MARKER: chain_runtime.follow
          SCHEMA_HASH: 5f68beddf80f7b9a
        run: |
          set -euo pipefail
          app=$(find build/polkadot-app.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -type d | head -1)
          [ -n "$app" ] || { echo "::error::no .app in build/polkadot-app.xcarchive"; exit 1; }
          exe=$(plutil -extract CFBundleExecutable raw -o - "$app/Info.plist")

          binaries=$(
            { echo "$app/$exe"; find "$app/Frameworks" "$app/PlugIns" -type f 2>/dev/null || true; } |
              while IFS= read -r f; do
                if [[ "$(file -b "$f")" == Mach-O* ]]; then echo "$f"; fi
              done
          )
          echo "scanning:"; printf '%s\n' "$binaries" | sed 's/^/  /'

          has() {
            while IFS= read -r bin; do
              LC_ALL=C grep -a -q -F -- "$1" "$bin" && return 0
            done <<< "$binaries"
            return 1
          }

          if ! has "$BASELINE_MARKER"; then
            echo "::error::no TrUAPI core found in $app: '$BASELINE_MARKER', present in every core since 0.16, is missing from its binaries. The core is not linked, or this fingerprint no longer matches how the core is built."
            exit 1
          fi

          missing=""
          for marker in $CORE_MARKERS; do
            if has "$marker"; then echo "ok: $marker"; else missing="$missing $marker"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::the archived app links a TrUAPI core older than ${TRUAPI_CORE_VERSION}: markers missing:${missing}. Expected trinity-user-agents ${TRUAPI_CORE_VERSION} @ ${TRUAPI_CORE_REVISION}; check Package.swift and Package.resolved."
            exit 1
          fi

          if has "$SCHEMA_HASH"; then
            echo "ok: wire schema hash $SCHEMA_HASH"
          else
            echo "::notice::wire schema hash $SCHEMA_HASH not in the binary (only the debugger sink embeds it)"
          fi

      - name: Export signed .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath build/polkadot-app.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.asc.outputs.key_path }}" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: polkadot-ios-dev
          path: build/*.ipa
          if-no-files-found: warn

      # Automatic signing on a fresh runner creates a certificate every run; revoke the ones
      # this runner created so the team account never fills up. Runs even when signing failed.
      - name: Revoke certificates created by this runner
        if: always()
        timeout-minutes: 10
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          [ -x "$RUNNER_TEMP/ascenv/bin/python" ] || { echo "tooling was never installed; nothing to revoke"; exit 0; }
          "$RUNNER_TEMP/ascenv/bin/python" .github/scripts/asc_signing.py revoke-runner-certs

  # ---- Tag — devnet branch only -----------------------------------------------------------
  # The build creates the tag: every devnet release tags the commit it built, before the
  # approval gate below, so a rejected hand-off still records what was built.
  tag:
    needs: testflight
    if: github.ref == 'refs/heads/devnet'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag the built commit
        id: tag
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          LAST=$(git ls-remote --tags origin "refs/tags/devnet/${DATE}.*" \
            | sed -n "s#.*refs/tags/devnet/${DATE}\.\([0-9]*\)\$#\1#p" | sort -n | tail -1)
          TAG="devnet/${DATE}.$(( ${LAST:-0} + 1 ))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "iOS devnet build ${GITHUB_RUN_NUMBER} (run ${GITHUB_RUN_ID})"
          git push origin "refs/tags/$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "### Tagged \`$TAG\` at ${GITHUB_SHA:0:8}" >> "$GITHUB_STEP_SUMMARY"

  # ---- TestFlight distribution — MANUAL APPROVAL GATE --------------------------------
  # Hands the build to the external devnet TestFlight group after the `tester-distribution` approval.
  distribute:
    needs: [testflight, tag]
    if: github.ref == 'refs/heads/devnet'
    runs-on: macos-26
    permissions:
      contents: write   # softprops/action-gh-release (release records) — the gate is the environment
    environment:
      name: tester-distribution
      url: ${{ vars.TESTFLIGHT_JOIN_URL }}
    steps:
      - name: Check required variables
        env:
          VARS: ${{ toJSON(vars) }}
        run: |
          required='["TESTFLIGHT_JOIN_URL","TESTFLIGHT_GROUP","BETA_FEEDBACK_EMAIL"]'
          missing="$(jq -r --argjson required "$required" '$required - (to_entries | map(select(.value != "")) | map(.key)) | join(" ")' <<< "$VARS")"
          if [ -n "$missing" ]; then
            echo "::error::Set these variables on the tester-distribution environment: $missing"
            exit 1
          fi

      - name: Download the signed .ipa
        uses: actions/download-artifact@v4
        with:
          name: polkadot-ios-dev
          path: build

      - name: Install App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          mkdir -p ./private_keys ~/.appstoreconnect/private_keys
          echo "$KEY_B64" | base64 --decode > "./private_keys/AuthKey_${KEY_ID}.p8"
          cp "./private_keys/AuthKey_${KEY_ID}.p8" ~/.appstoreconnect/private_keys/

      - name: Distribute to the external TestFlight group

        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          # Read from the environment, never interpolated into the script body.
          TAG: ${{ needs.tag.outputs.tag }}
          TF_GROUP: ${{ vars.TESTFLIGHT_GROUP }}
          FEEDBACK_EMAIL: ${{ vars.BETA_FEEDBACK_EMAIL }}
        run: |
          CHANGELOG="Devnet build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA:0:7}): ${TAG}."
          IPA=$(find build -maxdepth 1 -name '*.ipa' | head -1)
          [ -n "$IPA" ] || { echo "::error::no .ipa in the build artifact"; exit 1; }
          echo "Uploading $IPA"
          jq -n \
            --arg key_id "$KEY_ID" \
            --arg issuer_id "$ISSUER_ID" \
            --arg key "$(cat "./private_keys/AuthKey_${KEY_ID}.p8")" \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: false}' \
            > asc_api_key.json
          fastlane pilot upload \
            --api_key_path asc_api_key.json \
            --ipa "$IPA" \
            --distribute_external true \
            --groups "$TF_GROUP" \
            --beta_app_description "Developer build of the Polkadot app against the Paseo products devnet." \
            --beta_app_feedback_email "$FEEDBACK_EMAIL" \
            --changelog "$CHANGELOG"

      # The GitHub release carries no binary: it records the tag, commit and build number.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: ${{ needs.tag.outputs.tag }}
          prerelease: true
          body: |
            iOS developer build for the products devnet.

            Commit ${{ github.sha }} · build ${{ github.run_number }}

            Distribution is TestFlight-only:

            👉 Join and install: ${{ vars.TESTFLIGHT_JOIN_URL }}

            This is a **devnet** build for testing only; state may be wiped. Found a
            problem? [Report it](https://github.com/Polkadot-Community-Foundation/products-devnet-issues/issues/new/choose).
