name: Release (Dev)

# Archives the polkadot-app iOS client in the DEV configuration and distributes it to the
# external TestFlight group "Products Devnet". The Dev build is the PUBLIC developer build:
# it MIRRORS Nightly's testnet contour via its own dedicated flag (it carries -DDEV /
# -DTESTNET_FEATURE plus the FEATURE_* set named in polkadot-app/Configs/polkadot-app.dev.xcconfig
# — upstream retired -DW3S — and every network gate is `#elseif NIGHTLY || DEV`, so it reads
# `chains_v2`, resolving chains by the fixed ids nightly-relay / nightly-ah / nightly-people /
# nightly-bulletin in KnownChains.swift). It ships under the PRODUCTION bundle id
# io.pcf.polkadotapp (one app record — TestFlight-only records get binned) and the production
# Firebase app; Remote Config tells the builds apart by the `build_channel=dev` CUSTOM SIGNAL
# the Dev build sets at startup (FirebaseApplicationService), matched by the `dev_build_ios`
# condition. Network wiring is delivered at runtime from Firebase Remote Config
# (chains_v2 / dot_ns_config / ipfs_gateway_url / identity_backend_url) in the Firebase
# project whose GoogleService-Info plist you supply below.
#
# Build numbers are stamped from the CI run number (CURRENT_PROJECT_VERSION) so repeated
# uploads of the same marketing version are accepted. The first build of each version sent
# to the external group goes through Beta App Review before testers receive it.
#
# WEEKLY TRACK — a Thursday 18:00 UTC schedule ships a build to the same TestFlight group
# without anyone tagging. Scheduled runs carry no tag, so they mint a dated
# `ios-dev-weekly-YYYY-MM-DD` pre-release alongside the TestFlight upload; tagged
# `ios-dev-v*` runs keep publishing under their own tag. Two consequences worth knowing:
#   - Cron is UTC and does NOT follow DST: 18:00 UTC is 20:00 CEST in summer, 19:00 CET
#     in winter. Change the hour, not the timezone, if the local slot must hold.
#   - ⭐ The weekly build MUST NOT bump MARKETING_VERSION. Only CURRENT_PROJECT_VERSION
#     (the build number) is stamped here, from the CI run number; MARKETING_VERSION stays
#     wherever polkadot-app.xcodeproj/project.pbxproj has it and is bumped by hand, on
#     purpose. That is what lets every weekly reuse an already-approved version and reach
#     testers immediately — the first build of a NEW version goes through Beta App Review
#     and can lag a day. Do not add a MARKETING_VERSION override to this workflow.
# GitHub only runs schedules on the DEFAULT BRANCH, and suspends them after 60 days of
# repository inactivity.
#
# Required repository secrets:
#   APP_STORE_CONNECT_KEY_ID             App Store Connect API key id (.p8 key; needs the
#                                        App Manager role to manage TestFlight groups)
#   APP_STORE_CONNECT_ISSUER_ID          API issuer id
#   APP_STORE_CONNECT_KEY_CONTENT        base64 of the .p8 private key
#   APPLE_TEAM_ID                        Developer team id (for signing + ExportOptions)
#   GOOGLESERVICE_INFO_PLIST_DEV_BASE64  base64 of the PRODUCTION Firebase iOS app's
#                                        GoogleService-Info.plist (shared with the Dev build)
# Optional: SENTRY_DSN/SENTRY_ORG/SENTRY_PROJECT/SENTRY_AUTH_TOKEN, MELD_BASIC_AUTH_TOKEN.
#
# W3S_AUTH_KEY is NO LONGER USED. Upstream deleted W3SAuthorizedSigner and the
# ValueTransferAuthPallet signing protocol it implemented; W3S statements are now signed with
# the user's own wallet key. The repository secret can be revoked once this lands.
# Optional repository variable:
#   TESTFLIGHT_JOIN_URL  Public "Products Devnet" join link shown in the GitHub release body
#                        (falls back to the hardcoded link if unset).

on:
  workflow_dispatch:
  push:
    tags: ['ios-dev-v*']
  schedule:
    # Weekly devnet build — Thursday 18:00 UTC (20:00 CEST / 19:00 CET; cron has no DST).
    - cron: '0 18 * * 4'

permissions:
  contents: write

# One release run at a time. Don't cancel an in-progress run: a half-finished TestFlight
# upload should complete rather than abort, and a manual tag must not lose to a cron.
concurrency:
  group: release-dev
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    env:
      RUN_IN_CI: 'true'   # the project's "Copy GoogleService-Info" build phase skips when set
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/ios-dev-v') }}
      IS_WEEKLY: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Provide GoogleService-Info.plist (.dev Firebase app)
        env:
          GS_B64: ${{ secrets.GOOGLESERVICE_INFO_PLIST_DEV_BASE64 }}
        run: echo "$GS_B64" | base64 --decode > polkadot-app/GoogleService-Info.plist

      # Upstream replaced Scripts/inject-keys.sh (CIKeys.generated.swift) with
      # Runscripts/generate_secrets.sh (Secrets.generated.swift). The in-Xcode "Generate
      # Secrets" build phase skips when RUN_IN_CI=true, so CI must run it here.
      # W3S_AUTH_KEY is deliberately NOT passed: upstream deleted W3SAuthorizedSigner and
      # now signs W3S statements with the user's own wallet key, so the seed has no consumer.
      - name: Generate build-time secrets
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          MELD_BASIC_AUTH_TOKEN: ${{ secrets.MELD_BASIC_AUTH_TOKEN }}
        run: ./Runscripts/generate_secrets.sh

      - name: Install App Store Connect API key
        id: asc
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          mkdir -p ./private_keys ~/.appstoreconnect/private_keys
          echo "$KEY_B64" | base64 --decode > "./private_keys/AuthKey_${KEY_ID}.p8"
          cp "./private_keys/AuthKey_${KEY_ID}.p8" ~/.appstoreconnect/private_keys/
          echo "key_path=$PWD/private_keys/AuthKey_${KEY_ID}.p8" >> "$GITHUB_OUTPUT"

      - name: Resolve SwiftPM dependencies
        run: xcodebuild -resolvePackageDependencies -project polkadot-app.xcodeproj -scheme polkadot-app

      - name: Write ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF

      - name: Archive (Dev)
        env:
          # The scheme pre-action and the "Generate Secrets" build phase both re-run
          # Runscripts/generate_secrets.sh, but both no-op while RUN_IN_CI=true, so the
          # file written by the step above survives. Values still passed for the case
          # where that guard is ever lifted.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          MELD_BASIC_AUTH_TOKEN: ${{ secrets.MELD_BASIC_AUTH_TOKEN }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild \
            -project polkadot-app.xcodeproj \
            -scheme polkadot-app \
            -configuration Dev \
            -archivePath build/polkadot-app.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.asc.outputs.key_path }}" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      - name: Export signed .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath build/polkadot-app.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.asc.outputs.key_path }}" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      # Resolve which channel this run is, once, for the TestFlight changelog and the
      # release tag/title below. A scheduled run carries no tag, so it is dated instead.
      - name: Resolve release channel
        id: channel
        run: |
          DATE=$(date -u +%Y-%m-%d)
          if [ "$IS_TAG" = "true" ]; then
            CHANGELOG="Products Devnet build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA:0:7}): ${GITHUB_REF_NAME}."
          elif [ "$IS_WEEKLY" = "true" ]; then
            CHANGELOG="Weekly Products Devnet build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA:0:7}) — ${DATE}."
          else
            CHANGELOG="Products Devnet build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA:0:7}): developer build against the Paseo products devnet."
          fi
          {
            echo "date=$DATE"
            echo "changelog=$CHANGELOG"
          } >> "$GITHUB_OUTPUT"
          echo "channel: tag=$IS_TAG weekly=$IS_WEEKLY"

      - name: Distribute to TestFlight group "Products Devnet"
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          # Read from the environment, never interpolated into the script body: the
          # changelog embeds GITHUB_REF_NAME, and a crafted tag name must not be able to
          # break out of the quoting.
          CHANGELOG: ${{ steps.channel.outputs.changelog }}
        run: |
          IPA=$(find build -maxdepth 1 -name '*.ipa' | head -1)
          echo "Uploading $IPA"
          jq -n \
            --arg key_id "$KEY_ID" \
            --arg issuer_id "$ISSUER_ID" \
            --arg key "$(cat "./private_keys/AuthKey_${KEY_ID}.p8")" \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: false}' \
            > asc_api_key.json
          fastlane pilot upload \
            --api_key_path asc_api_key.json \
            --ipa "$IPA" \
            --distribute_external true \
            --groups "Products Devnet" \
            --beta_app_description "Developer build of the Polkadot app against the Paseo products devnet." \
            --beta_app_feedback_email "alemart@polkadotcommunity.foundation" \
            --changelog "$CHANGELOG"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: polkadot-ios-dev
          path: build/*.ipa
          if-no-files-found: warn

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/ios-dev-v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: true
          body: |
            iOS developer build for the products devnet.

            Distribution is TestFlight-only:

            👉 Join and install: ${{ vars.TESTFLIGHT_JOIN_URL || 'https://testflight.apple.com/join/tCzFysKq' }}

      # ---------------------------------------------------------------- weekly track
      # Scheduled runs carry no tag, so mint a dated pre-release. It exists to give the
      # weekly build a citable landmark (date ↔ commit ↔ build number) — the binary still
      # only ever reaches testers through TestFlight, so no assets are attached.
      - name: Create weekly GitHub pre-release
        if: env.IS_WEEKLY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-dev-weekly-${{ steps.channel.outputs.date }}
          name: Weekly devnet build ${{ steps.channel.outputs.date }} (iOS)
          prerelease: true
          body: |
            Weekly iOS developer build for the products devnet — ${{ steps.channel.outputs.date }}.

            Commit ${{ github.sha }} · build ${{ github.run_number }}

            Distribution is TestFlight-only:

            👉 Join and install: ${{ vars.TESTFLIGHT_JOIN_URL || 'https://testflight.apple.com/join/tCzFysKq' }}

            This is a **devnet** build for testing only; state may be wiped. Found a
            problem? [Report it](https://github.com/Polkadot-Community-Foundation/products-devnet-issues/issues/new/choose).

      # Alternative distribution (instead of TestFlight): build an `ad-hoc` ipa
      # (ExportOptions method=ad-hoc) and run
      #   firebase appdistribution:distribute build/polkadot-app.ipa \
      #     --app "$FIREBASE_APP_ID" --groups "$FIREBASE_GROUPS"
      # authenticated via a service account with Firebase App Distribution Admin.
      # The .dev Firebase app id is 1:165923692956:ios:3d940e376173f34bd72859.
