name: Build (Production)

# PCF-231 / PCF-239. Builds the Release configuration (the production surface: no environment,
# no feature flags) and asserts its identity. Dispatch-only.
#
#   signing: none        unsigned compile proof; evidence goes to the private bucket only.
#   signing: production  additionally archives, signs and uploads to TestFlight, available ONLY
#                        to the INTERNAL group "Release Internal". Never an external group, never
#                        App Store review. The `sign` job waits on `production-distribution`
#                        (required reviewers).
#
# Lane isolation (runnable alongside the devnet lane):
#   concurrency group  build-production-*        (devnet: build-dev-*, release-dev)
#   output             private bucket, prefix ios/; TestFlight internal group "Release Internal"
#                      Never an Actions artifact: this repository is public.
#   configuration      Release                   (devnet: Dev)
#   build number       10000 + run number        (devnet: release-dev run number). Both lanes
#                      upload to the same App Store record (io.pcf.polkadotapp), so the ranges
#                      must never meet.
#
# Environment `production` (no protection):
#   secret GOOGLESERVICE_INFO_PLIST_PROD_BASE64  (optional) production Firebase plist. Falls back
#       to the repo-level GOOGLESERVICE_INFO_PLIST_DEV_BASE64, which is the Firebase app registered
#       for io.pcf.polkadotapp (the Dev build shares it), then to the committed placeholder.
#   secret MELD_BASIC_AUTH_TOKEN   (optional) Meld on-ramp token. Absent => on-ramp inert.
#   var    PRODUCTION_BUNDLE_ID    asserted against what the build resolved.
#
# Environment `production-distribution` (REQUIRED REVIEWERS):
#   secrets PRODUCTION_APPLE_TEAM_ID, PRODUCTION_APP_STORE_CONNECT_KEY_ID,
#   PRODUCTION_APP_STORE_CONNECT_ISSUER_ID, PRODUCTION_APP_STORE_CONNECT_KEY_CONTENT.
#   Interim: each falls back to the repo-level devnet App Store Connect key (APPLE_TEAM_ID,
#   APP_STORE_CONNECT_*), same team, same app record. Set the PRODUCTION_* names to split them.
#
# SENTRY_* is deliberately not wired: Sentry is compiled only under TESTNET_FEATURE.

on:
  workflow_dispatch:
    inputs:
      signing:
        description: 'none = unsigned build only. production = also archive, sign and upload to the internal TestFlight group "Release Internal" (waits for production-distribution approval).'
        type: choice
        options:
          - none
          - production
        default: none
      ref:
        description: 'Git ref to build (branch, tag or SHA). Empty = the ref this workflow was dispatched on. Lets a frozen production baseline be rebuilt later without editing this file.'
        type: string
        required: false
        default: ''

# No `push`, no `pull_request`, no `tags`, no `schedule`. Dispatch-only is the strongest
# guarantee that nothing ever ships by accident from this lane.

permissions:
  contents: read

concurrency:
  # Distinct from build-dev-${{ github.ref }} and from release-dev, so a production run can
  # never cancel a devnet run and vice versa. Keyed on the ref actually being built.
  group: build-production-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  # Uploads to the private bucket must not use parallel composite uploads: their temporary parts live outside
  # this repository's prefix and need delete to clean up, which the build identity deliberately lacks.
  CLOUDSDK_STORAGE_PARALLEL_COMPOSITE_UPLOAD_ENABLED: "False"

jobs:
  build:
    name: Build Release (unsigned)
    runs-on: macos-15
    timeout-minutes: 90
    # Public production CONFIGURATION only. Deliberately ungated, so a production build can run
    # without an approval click and therefore in parallel with a devnet build. Key material
    # lives in `production-distribution`, which the `sign` job declares.
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      RUN_IN_CI: 'true'   # the project's "Copy GoogleService-Info" build phase skips when set
    steps:
      # The build and its evidence go to a private bucket. Refuse to build without one.
      - name: Require the private output configuration
        env:
          BUILD_BUCKET: ${{ vars.BUILD_BUCKET }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          missing=0
          for name in BUILD_BUCKET GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the production environment; refusing to build without a private output"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v4
        with:
          # Empty string = actions/checkout's default (the dispatched ref).
          ref: ${{ inputs.ref }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # polkadot-app/GoogleService-Info.plist is gitignored and absent from a fresh checkout.
      # The project uses Xcode synchronized folders, so the file is NOT a required build input
      # and its absence would not fail the compile — but a Release artifact with no Firebase
      # configuration is a misleading artifact, and the copy build phase (which selects
      # GoogleService-Info-Release.plist for the Release configuration) is skipped while
      # RUN_IN_CI=true. Provide it here, exactly as build-dev.yml does for Dev.
      - name: Provide GoogleService-Info.plist (production Firebase app)
        env:
          GS_PROD_B64: ${{ secrets.GOOGLESERVICE_INFO_PLIST_PROD_BASE64 }}
          GS_APP_B64: ${{ secrets.GOOGLESERVICE_INFO_PLIST_DEV_BASE64 }}
        run: |
          if [ -n "$GS_PROD_B64" ]; then
            echo "$GS_PROD_B64" | base64 --decode > polkadot-app/GoogleService-Info.plist
            echo "::notice::Firebase: GOOGLESERVICE_INFO_PLIST_PROD_BASE64"
          elif [ -n "$GS_APP_B64" ]; then
            echo "$GS_APP_B64" | base64 --decode > polkadot-app/GoogleService-Info.plist
            echo "::notice::Firebase: repo-level GOOGLESERVICE_INFO_PLIST_DEV_BASE64 (the io.pcf.polkadotapp Firebase app)"
          else
            cp polkadot-app/GoogleService/GoogleService-Info-Release.plist.template \
               polkadot-app/GoogleService-Info.plist
            echo "::warning::Firebase: no plist secret; using the committed PLACEHOLDER. This build cannot reach Remote Config at runtime."
          fi
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' polkadot-app/GoogleService-Info.plist 2>/dev/null || true)
          echo "Firebase plist BUNDLE_ID: ${bundle:-<none>}"

      # Upstream replaced Scripts/inject-keys.sh with Runscripts/generate_secrets.sh.
      # The in-Xcode "Generate Secrets" phase skips when RUN_IN_CI=true, so CI runs it here.
      # SENTRY_DSN is not passed: Sentry is compiled out of Release (TESTNET_FEATURE only).
      - name: Generate build-time secrets
        env:
          MELD_BASIC_AUTH_TOKEN: ${{ secrets.MELD_BASIC_AUTH_TOKEN }}
        run: |
          ./Runscripts/generate_secrets.sh
          if [ -z "${MELD_BASIC_AUTH_TOKEN}" ]; then
            echo "::warning::MELD_BASIC_AUTH_TOKEN is unset; the Meld fiat on-ramp is inert in this artifact (needs a Meld partner key)."
          fi

      - name: Resolve SwiftPM dependencies
        run: xcodebuild -resolvePackageDependencies -project polkadot-app.xcodeproj -scheme polkadot-app

      # The production claim this lane exists to defend is "Release is the production surface".
      # -showBuildSettings is the only thing that can prove which flags and which identity the
      # Release configuration actually resolves to, so assert them rather than trusting the
      # xcconfig chain to still say what it says after the next upstream sync.
      #
      # Resolution chain being asserted:
      #   polkadot-app/Configs/polkadot-app.release.xcconfig  BUNDLE = $(APP_MAIN_BUNDLE)
      #     -> Configs/base.release.xcconfig                  APP_MAIN_BUNDLE = $(BRAND_BUNDLE_ROOT)
      #                                                       BASE_SWIFT_FLAGS =   (empty, on purpose)
      #     -> Configs/brand.xcconfig                         BRAND_BUNDLE_ROOT = io.pcf.polkadotapp
      - name: Verify the Release configuration is the production surface
        run: |
          set -o pipefail
          xcodebuild \
            -project polkadot-app.xcodeproj \
            -scheme polkadot-app \
            -configuration Release \
            -showBuildSettings 2>/dev/null | sed -e 's/^[[:space:]]*//' > build-settings.txt

          fail=0

          # --- feature axis -------------------------------------------------------------
          # Release must carry NO environment and NO feature flag. Any of these appearing here
          # means a devnet/testnet surface has leaked into the production configuration.
          for flag in -DDEV -DNIGHTLY -DUNSTABLE -DTESTNET_FEATURE -DF_DEV -DE2E_TEST \
                      -DFEATURE_DIMS -DFEATURE_DIMS_FULL -DFEATURE_PRODUCTS -DFEATURE_SIGN_IN \
                      -DFEATURE_PRIZES -DDISABLE_AUTH; do
            if grep -E '^OTHER_SWIFT_FLAGS = ' build-settings.txt | grep -qF -- "$flag"; then
              echo "::error::${flag} is set in the Release configuration — Release must carry no environment and no feature flags"
              grep -E '^OTHER_SWIFT_FLAGS = ' build-settings.txt
              fail=1
            fi
          done

          # --- icon ---------------------------------------------------------------------
          # Release ships the unsuffixed production icon. AppIconDev here means the Dev leaf's
          # ICON_SUFFIX has leaked into the Release chain.
          if grep -qxF "ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon" build-settings.txt; then
            echo "ok: ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon"
          else
            echo "::error::Release must resolve ASSETCATALOG_COMPILER_APPICON_NAME to AppIcon"
            grep -E '^ASSETCATALOG_COMPILER_APPICON_NAME = ' build-settings.txt || echo "  (setting absent entirely)"
            fail=1
          fi

          # --- identity must at least be COMPLETE ---------------------------------------
          # An empty expansion is the failure mode that builds green and breaks at launch:
          # PRODUCT_BUNDLE_IDENTIFIER, APP_MAIN_BUNDLE and DEEPLINK all flow from brand.xcconfig
          # through Info.plist and AppConfig.Brand, which traps at startup on an empty key.
          for key in PRODUCT_BUNDLE_IDENTIFIER APP_MAIN_BUNDLE DEEPLINK APP_NAME; do
            if grep -qE "^${key} = .+" build-settings.txt; then
              echo "ok: $(grep -m1 -E "^${key} = .+" build-settings.txt)"
            else
              echo "::error::${key} is empty or unset for the Release configuration"
              fail=1
            fi
          done
          # The app group has no build setting of its own: Info.plist (BrandAppGroup) and the
          # entitlements use group.$(APP_MAIN_BUNDLE) directly.
          echo "app group: group.$(grep -m1 -E '^APP_MAIN_BUNDLE = ' build-settings.txt | sed 's/^APP_MAIN_BUNDLE = //')"

          # --- identity OWNERSHIP -------------------------------------------------------
          # Today Release resolves to Parity's identity, by design of the inherited
          # brand.xcconfig. That is a blocker for shipping, NOT for compiling, so with
          # signing=none it is a loud warning; it is a hard error the moment anyone tries to
          # sign, because PCF must never publish under io.parity.*.
          resolved=$(grep -m1 -E '^PRODUCT_BUNDLE_IDENTIFIER = ' build-settings.txt | sed 's/^PRODUCT_BUNDLE_IDENTIFIER = //')
          echo "Release bundle identifier resolves to: ${resolved}"
          if printf '%s' "$resolved" | grep -q '^io\.parity\.'; then
            if [ "${{ inputs.signing }}" = "production" ]; then
              echo "::error::the Release configuration still resolves to a Parity bundle identifier (${resolved}); refusing to sign"
              fail=1
            else
              echo "::warning::the Release configuration resolves to Parity's bundle identifier (${resolved}) and Parity's DEVELOPMENT_TEAM. PCF must never ship under io.parity.*; check BRAND_BUNDLE_ROOT in Configs/brand.xcconfig."
            fi
          fi

          # When the production identity is known, pin it.
          expected='${{ vars.PRODUCTION_BUNDLE_ID }}'
          if [ -n "$expected" ] && [ "$resolved" != "$expected" ]; then
            echo "::error::Release resolved to '${resolved}' but the production environment expects '${expected}'"
            fail=1
          fi

          {
            echo "### Release configuration — resolved identity"
            echo ''
            echo '```'
            grep -E '^(PRODUCT_BUNDLE_IDENTIFIER|APP_MAIN_BUNDLE|APP_NAME|DEEPLINK|MARKETING_VERSION|DEVELOPMENT_TEAM|ASSETCATALOG_COMPILER_APPICON_NAME|OTHER_SWIFT_FLAGS) = ' build-settings.txt | sort -u
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit $fail

      # Shape-identical to build-dev.yml's "Build (Dev, no code signing)" step except for
      # -configuration Release. Unsigned, so it needs no Apple Developer portal registration,
      # no provisioning profile and no App Store Connect key — which is the only reason this
      # lane can run on this fork at all.
      - name: Build (Release, no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project polkadot-app.xcodeproj \
            -scheme polkadot-app \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild-production.log

      # The artifact is the evidence, not a deliverable: an unsigned .app cannot be installed
      # on a device and is not an .ipa. It exists so a human can inspect what the production
      # configuration actually produced — Info.plist identity, linked binary, bundled resources.
      - name: Collect the built product
        if: always()
        continue-on-error: true
        run: |
          set +e
          mkdir -p production-evidence
          cp build-settings.txt xcodebuild-production.log production-evidence/ 2>/dev/null

          app=$(find ~/Library/Developer/Xcode/DerivedData \
            -path '*/Build/Products/Release-iphoneos/polkadot-app.app' -type d 2>/dev/null | head -1)
          if [ -z "$app" ]; then
            echo "no Release-iphoneos polkadot-app.app found"
            exit 0
          fi
          echo "app bundle: $app"
          plutil -p "$app/Info.plist" > production-evidence/info-plist.txt 2>&1
          du -sh "$app" | tee production-evidence/bundle-size.txt
          ditto -c -k --sequesterRsrc --keepParent "$app" production-evidence/polkadot-app-Release-unsigned.zip
          ls -la production-evidence/

      # Private bucket ONLY (keyless sign-in, create and read under `ios/` only). No Actions
      # artifact, no softprops/action-gh-release, no upload_to_testflight, no firebase
      # appdistribution:distribute, no aws s3 cp.
      - uses: google-github-actions/auth@v3
        if: always()
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        if: always()

      - name: Upload the unsigned production build to the private bucket
        if: always()
        env:
          BUILD_BUCKET: ${{ vars.BUILD_BUCKET }}
        run: |
          set -euo pipefail
          if [ ! -d production-evidence ] || [ -z "$(ls -A production-evidence)" ]; then
            echo "::warning::no production evidence was produced"
            exit 0
          fi
          PREFIX="ios/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud storage cp --if-generation-match=0 production-evidence/* "gs://${BUILD_BUCKET}/${PREFIX}/"
          {
            echo "### Unsigned build stored privately"
            echo '```'
            echo "gs://${BUILD_BUCKET}/${PREFIX}/"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Archive, sign and upload to TestFlight for the INTERNAL group "Release Internal" only.
  # Runs after `build` has proved the Release identity, and waits for a reviewer on
  # `production-distribution`. The gate lives in the ENVIRONMENT: if it is ever deleted, GitHub
  # recreates it unprotected and this job runs straight through.
  sign:
    name: Sign + TestFlight (Release Internal)
    needs: build
    if: inputs.signing == 'production'
    runs-on: macos-15
    timeout-minutes: 120
    environment: production-distribution
    env:
      RUN_IN_CI: 'true'
      TESTFLIGHT_GROUP: Release Internal
      # PRODUCTION_* first; interim fallback to the repo-level devnet App Store Connect key.
      TEAM_ID: ${{ secrets.PRODUCTION_APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.PRODUCTION_APP_STORE_CONNECT_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.PRODUCTION_APP_STORE_CONNECT_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - name: Require the signing material
        env:
          KEY_B64: ${{ secrets.PRODUCTION_APP_STORE_CONNECT_KEY_CONTENT || secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          USING_PRODUCTION_KEY: ${{ secrets.PRODUCTION_APP_STORE_CONNECT_KEY_ID != '' }}
        run: |
          missing=''
          [ -n "$TEAM_ID" ]   || missing="$missing TEAM_ID"
          [ -n "$KEY_ID" ]    || missing="$missing KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing ISSUER_ID"
          [ -n "$KEY_B64" ]   || missing="$missing KEY_CONTENT"
          if [ -n "$missing" ]; then
            echo "::error::missing App Store Connect inputs:$missing"
            exit 1
          fi
          if [ "$USING_PRODUCTION_KEY" = "true" ]; then
            echo "App Store Connect key: PRODUCTION_* (production-distribution)"
          else
            echo "::warning::App Store Connect key: repo-level devnet key (interim). Set PRODUCTION_APP_STORE_CONNECT_* in production-distribution to split it."
          fi
          # 10000 + run number: disjoint from the devnet lane's build numbers in the shared record.
          BUILD_NUMBER=$((10000 + GITHUB_RUN_NUMBER))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "SIGN_STARTED=$(date -u +%s)" >> "$GITHUB_ENV"
          echo "build number: $BUILD_NUMBER"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Same resolution as the build job.
      - name: Provide GoogleService-Info.plist (production Firebase app)
        env:
          GS_PROD_B64: ${{ secrets.GOOGLESERVICE_INFO_PLIST_PROD_BASE64 }}
          GS_APP_B64: ${{ secrets.GOOGLESERVICE_INFO_PLIST_DEV_BASE64 }}
        run: |
          if [ -n "$GS_PROD_B64" ]; then
            echo "$GS_PROD_B64" | base64 --decode > polkadot-app/GoogleService-Info.plist
          elif [ -n "$GS_APP_B64" ]; then
            echo "$GS_APP_B64" | base64 --decode > polkadot-app/GoogleService-Info.plist
          else
            echo "::error::no Firebase plist; refusing to ship a TestFlight build that cannot reach Remote Config"
            exit 1
          fi

      - name: Generate build-time secrets
        env:
          MELD_BASIC_AUTH_TOKEN: ${{ secrets.MELD_BASIC_AUTH_TOKEN }}
        run: ./Runscripts/generate_secrets.sh

      - name: Install App Store Connect API key
        id: asc
        env:
          KEY_B64: ${{ secrets.PRODUCTION_APP_STORE_CONNECT_KEY_CONTENT || secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey_${KEY_ID}.p8"
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$RUNNER_TEMP/asc/AuthKey_${KEY_ID}.p8" ~/.appstoreconnect/private_keys/
          echo "key_path=$RUNNER_TEMP/asc/AuthKey_${KEY_ID}.p8" >> "$GITHUB_OUTPUT"

      # Isolated venv: the runner's Homebrew python refuses a global pip install.
      - name: Install App Store Connect tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/ascenv"
          "$RUNNER_TEMP/ascenv/bin/pip" install --quiet pyjwt cryptography requests

      # Fails in seconds, before the archive: key accepted, app record visible, group internal.
      - name: Preflight App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.PRODUCTION_APP_STORE_CONNECT_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.PRODUCTION_APP_STORE_CONNECT_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_B64: ${{ secrets.PRODUCTION_APP_STORE_CONNECT_KEY_CONTENT || secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          BUNDLE_ID: ${{ vars.PRODUCTION_BUNDLE_ID || 'io.pcf.polkadotapp' }}
        run: |
          echo "team ${TEAM_ID:0:4}…"
          "$RUNNER_TEMP/ascenv/bin/python" .github/scripts/asc_signing.py preflight

      - name: Resolve SwiftPM dependencies
        run: xcodebuild -resolvePackageDependencies -project polkadot-app.xcodeproj -scheme polkadot-app

      - name: Write ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF

      - name: Archive (Release)
        run: |
          set -o pipefail
          xcodebuild \
            -project polkadot-app.xcodeproj \
            -scheme polkadot-app \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/polkadot-app.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.asc.outputs.key_path }}" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive 2>&1 | tail -n 200

      - name: Export signed .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath build/polkadot-app.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/ \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.asc.outputs.key_path }}" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Verify the signed .ipa identity
        run: |
          set -euo pipefail
          IPA=$(find build -maxdepth 1 -name '*.ipa' | head -1)
          [ -n "$IPA" ] || { echo "::error::no .ipa exported"; exit 1; }
          mkdir -p "$RUNNER_TEMP/ipa" && unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
          app=$(find "$RUNNER_TEMP/ipa/Payload" -maxdepth 1 -name '*.app' | head -1)
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          ver=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          num=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")
          codesign -d --entitlements :- "$app" > "$RUNNER_TEMP/entitlements.plist" 2>/dev/null
          aps=$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$RUNNER_TEMP/entitlements.plist" 2>/dev/null || echo '<none>')
          {
            echo "### Signed production build"
            echo '```'
            echo "bundle id       $id"
            echo "version         $ver ($num)"
            echo "aps-environment $aps"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          expected='${{ vars.PRODUCTION_BUNDLE_ID }}'
          if [ -n "$expected" ] && [ "$id" != "$expected" ]; then
            echo "::error::signed bundle id '$id' != PRODUCTION_BUNDLE_ID '$expected'"
            exit 1
          fi
          [ "$num" = "$BUILD_NUMBER" ] || { echo "::error::CFBundleVersion $num != $BUILD_NUMBER"; exit 1; }
          echo "IPA=$IPA" >> "$GITHUB_ENV"

      # Internal group only: no --distribute_external, so no Beta App Review and no public link.
      - name: Upload to TestFlight (internal group only)
        run: |
          jq -n \
            --arg key_id "$KEY_ID" \
            --arg issuer_id "$ISSUER_ID" \
            --rawfile key "${{ steps.asc.outputs.key_path }}" \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: false}' \
            > "$RUNNER_TEMP/asc_api_key.json"
          fastlane pilot upload \
            --api_key_path "$RUNNER_TEMP/asc_api_key.json" \
            --ipa "$IPA" \
            --distribute_external false \
            --groups "$TESTFLIGHT_GROUP" \
            --changelog "Production (Release) build ${BUILD_NUMBER} (${GITHUB_SHA:0:7}). Internal testing only."
          {
            echo "### TestFlight"
            echo "Uploaded build ${BUILD_NUMBER} to internal group **${TESTFLIGHT_GROUP}**."
          } >> "$GITHUB_STEP_SUMMARY"

      # Automatic signing on a fresh runner creates a certificate every run; revoke the ones
      # this runner created so the team account never fills up. Runs even when signing failed.
      - name: Revoke certificates created by this runner
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.PRODUCTION_APP_STORE_CONNECT_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.PRODUCTION_APP_STORE_CONNECT_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_B64: ${{ secrets.PRODUCTION_APP_STORE_CONNECT_KEY_CONTENT || secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          [ -x "$RUNNER_TEMP/ascenv/bin/python" ] || { echo "tooling was never installed; nothing to revoke"; exit 0; }
          "$RUNNER_TEMP/ascenv/bin/python" .github/scripts/asc_signing.py revoke-runner-certs
