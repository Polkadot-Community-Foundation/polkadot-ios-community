name: Build (Production)

# PCF-231 / PCF-239. Builds the Release configuration (the production surface: no environment,
# no feature flags) and asserts its identity. Dispatch-only.
#
#   signing: none        unsigned compile proof; evidence goes to the private bucket only.
#   signing: production  additionally archives, signs and uploads to TestFlight, available ONLY
#                        to the INTERNAL group "Release Internal". Never an external group, never
#                        App Store review. The `sign` job waits on `production-distribution`
#                        (required reviewers).
#
# Lane isolation (runnable alongside the devnet lane):
#   concurrency group  build-production-*        (devnet: build-dev-*, release-dev)
#   output             private bucket, prefix ios/; TestFlight internal group "Release Internal"
#                      Never an Actions artifact: this repository is public.
#   configuration      Release                   (devnet: Dev)
#   build number       10000 + run number        (devnet: release-dev run number). Both lanes
#                      upload to the same App Store record (io.pcf.polkadotapp), so the ranges
#                      must never meet.
#
# Environment `production` (no protection), the unsigned `build` job:
#   secret GOOGLESERVICE_INFO_PLIST_PROD_BASE64  (optional) production Firebase plist. Falls back
#       to the repo-level GOOGLESERVICE_INFO_PLIST_DEV_BASE64, which is the Firebase app registered
#       for io.pcf.polkadotapp (the Dev build shares it), then to the committed placeholder.
#   secret MELD_BASIC_AUTH_TOKEN   (optional) Meld on-ramp token. Absent => on-ramp inert.
#   var    PRODUCTION_BUNDLE_ID    pins the id the unsigned Release build resolves to.
#
# Environment `production-distribution` (REQUIRED REVIEWERS), the `sign` job. It cannot read
# `production` secrets, and it never falls back to repo-level devnet material:
#   secret GOOGLESERVICE_INFO_PLIST_PROD_BASE64  REQUIRED. Its BUNDLE_ID must be PRODUCTION_BUNDLE_ID.
#   secret MELD_BASIC_AUTH_TOKEN     (optional) as above.
#   var PRODUCTION_BUNDLE_ID         REQUIRED. The signed .ipa is asserted against it before upload.
#   var IOS_SIGNING_SECRET           Secret Manager secret holding the App Store Connect key
#                                    (key-id, issuer-id, team-id, private-key), read at run time.
#   var IOS_SIGNING_SERVICE_ACCOUNT  the only identity allowed to read it; federated for this
#                                    repository in this environment only.
#   var GCP_WORKLOAD_IDENTITY_PROVIDER
#   No GitHub secret holds Apple signing material for this lane.
#
# Signing runs only when dispatched on the `production` branch or a production/* tag, with `ref`
# empty or a production/* tag: the built code's build phases run while the key is on disk. The
# signing helper itself always comes from the dispatched commit, never from `ref`.
#
# SENTRY_* is deliberately not wired: Sentry is compiled only under TESTNET_FEATURE.

on:
  workflow_dispatch:
    inputs:
      signing:
        description: 'none = unsigned build only. validate = check the signing material in ~3 minutes without building. upload = send the last signed .ipa from the private bucket to TestFlight, no rebuild. production = build, sign and upload (waits for production-distribution approval).'
        type: choice
        options:
          - none
          - validate
          - upload
          - production
        default: none
      ref:
        description: 'Git ref to build (branch, tag or SHA). Empty = the ref this workflow was dispatched on. Lets a frozen production baseline be rebuilt later without editing this file. signing=production accepts only empty or a production/* tag.'
        type: string
        required: false
        default: ''

# No `push`, no `pull_request`, no `tags`, no `schedule`. Dispatch-only is the strongest
# guarantee that nothing ever ships by accident from this lane.

permissions:
  contents: read

concurrency:
  # Distinct from build-dev-${{ github.ref }} and from release-dev, so a production run can
  # never cancel a devnet run and vice versa. Keyed on the ref actually being built.
  group: build-production-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  # Uploads to the private bucket must not use parallel composite uploads: their temporary parts live outside
  # this repository's prefix and need delete to clean up, which the build identity deliberately lacks.
  CLOUDSDK_STORAGE_PARALLEL_COMPOSITE_UPLOAD_ENABLED: "False"

jobs:
  build:
    name: Build Release (unsigned)
    if: inputs.signing == 'none' || inputs.signing == 'production'
    runs-on: macos-15
    timeout-minutes: 90
    # Public production CONFIGURATION only. Deliberately ungated, so a production build can run
    # without an approval click and therefore in parallel with a devnet build. Key material
    # lives in `production-distribution`, which the `sign` job declares.
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      RUN_IN_CI: 'true'   # the project's "Copy GoogleService-Info" build phase skips when set
    steps:
      # The build and its evidence go to a private bucket. Refuse to build without one.
      - name: Require the private output configuration
        env:
          BUILD_BUCKET: ${{ vars.BUILD_BUCKET }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          missing=0
          for name in BUILD_BUCKET GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the production environment; refusing to build without a private output"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Empty string = actions/checkout's default (the dispatched ref).
          ref: ${{ inputs.ref }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      # polkadot-app/GoogleService-Info.plist is gitignored and absent from a fresh checkout.
      # The project uses Xcode synchronized folders, so the file is NOT a required build input
      # and its absence would not fail the compile — but a Release artifact with no Firebase
      # configuration is a misleading artifact, and the copy build phase (which selects
      # GoogleService-Info-Release.plist for the Release configuration) is skipped while
      # RUN_IN_CI=true. Provide it here, exactly as build-dev.yml does for Dev.
      - name: Provide GoogleService-Info.plist (production Firebase app)
        env:
          GS_PROD_B64: ${{ secrets.GOOGLESERVICE_INFO_PLIST_PROD_BASE64 }}
          GS_APP_B64: ${{ secrets.GOOGLESERVICE_INFO_PLIST_DEV_BASE64 }}
        run: |
          if [ -n "$GS_PROD_B64" ]; then
            echo "$GS_PROD_B64" | base64 --decode > polkadot-app/GoogleService-Info.plist
            echo "::notice::Firebase: GOOGLESERVICE_INFO_PLIST_PROD_BASE64"
          elif [ -n "$GS_APP_B64" ]; then
            echo "$GS_APP_B64" | base64 --decode > polkadot-app/GoogleService-Info.plist
            echo "::notice::Firebase: repo-level GOOGLESERVICE_INFO_PLIST_DEV_BASE64 (the io.pcf.polkadotapp Firebase app)"
          else
            cp polkadot-app/GoogleService/GoogleService-Info-Release.plist.template \
               polkadot-app/GoogleService-Info.plist
            echo "::warning::Firebase: no plist secret; using the committed PLACEHOLDER. This build cannot reach Remote Config at runtime."
          fi
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' polkadot-app/GoogleService-Info.plist 2>/dev/null || true)
          echo "Firebase plist BUNDLE_ID: ${bundle:-<none>}"

      # Upstream replaced Scripts/inject-keys.sh with Runscripts/generate_secrets.sh.
      # The in-Xcode "Generate Secrets" phase skips when RUN_IN_CI=true, so CI runs it here.
      # SENTRY_DSN is not passed: Sentry is compiled out of Release (TESTNET_FEATURE only).
      - name: Generate build-time secrets
        env:
          MELD_BASIC_AUTH_TOKEN: ${{ secrets.MELD_BASIC_AUTH_TOKEN }}
        run: |
          ./Runscripts/generate_secrets.sh
          if [ -z "${MELD_BASIC_AUTH_TOKEN}" ]; then
            echo "::warning::MELD_BASIC_AUTH_TOKEN is unset; the Meld fiat on-ramp is inert in this artifact (needs a Meld partner key)."
          fi

      - name: Resolve SwiftPM dependencies
        run: xcodebuild -resolvePackageDependencies -project polkadot-app.xcodeproj -scheme polkadot-app

      # The production claim this lane exists to defend is "Release is the production surface".
      # -showBuildSettings is the only thing that can prove which flags and which identity the
      # Release configuration actually resolves to, so assert them rather than trusting the
      # xcconfig chain to still say what it says after the next upstream sync.
      #
      # Resolution chain being asserted:
      #   polkadot-app/Configs/polkadot-app.release.xcconfig  BUNDLE = $(APP_MAIN_BUNDLE)
      #     -> Configs/base.release.xcconfig                  APP_MAIN_BUNDLE = $(BRAND_BUNDLE_ROOT)
      #                                                       BASE_SWIFT_FLAGS =   (empty, on purpose)
      #     -> Configs/brand.xcconfig                         BRAND_BUNDLE_ROOT = io.pcf.polkadotapp
      - name: Verify the Release configuration is the production surface
        run: |
          set -o pipefail
          xcodebuild \
            -project polkadot-app.xcodeproj \
            -scheme polkadot-app \
            -configuration Release \
            -showBuildSettings 2>/dev/null | sed -e 's/^[[:space:]]*//' > build-settings.txt

          fail=0

          # --- feature axis -------------------------------------------------------------
          # Release must carry NO environment and NO feature flag. Any of these appearing here
          # means a devnet/testnet surface has leaked into the production configuration.
          for flag in -DDEV -DNIGHTLY -DUNSTABLE -DTESTNET_FEATURE -DF_DEV -DE2E_TEST \
                      -DFEATURE_DIMS -DFEATURE_DIMS_FULL -DFEATURE_PRODUCTS -DFEATURE_SIGN_IN \
                      -DFEATURE_PRIZES -DDISABLE_AUTH; do
            if grep -E '^OTHER_SWIFT_FLAGS = ' build-settings.txt | grep -qF -- "$flag"; then
              echo "::error::${flag} is set in the Release configuration — Release must carry no environment and no feature flags"
              grep -E '^OTHER_SWIFT_FLAGS = ' build-settings.txt
              fail=1
            fi
          done

          # --- icon ---------------------------------------------------------------------
          # Release ships the unsuffixed production icon. AppIconDev here means the Dev leaf's
          # ICON_SUFFIX has leaked into the Release chain.
          if grep -qxF "ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon" build-settings.txt; then
            echo "ok: ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon"
          else
            echo "::error::Release must resolve ASSETCATALOG_COMPILER_APPICON_NAME to AppIcon"
            grep -E '^ASSETCATALOG_COMPILER_APPICON_NAME = ' build-settings.txt || echo "  (setting absent entirely)"
            fail=1
          fi

          # --- identity must at least be COMPLETE ---------------------------------------
          # An empty expansion is the failure mode that builds green and breaks at launch:
          # PRODUCT_BUNDLE_IDENTIFIER, APP_MAIN_BUNDLE and DEEPLINK all flow from brand.xcconfig
          # through Info.plist and AppConfig.Brand, which traps at startup on an empty key.
          for key in PRODUCT_BUNDLE_IDENTIFIER APP_MAIN_BUNDLE APP_GROUP DEEPLINK APP_NAME; do
            if grep -qE "^${key} = .+" build-settings.txt; then
              echo "ok: $(grep -m1 -E "^${key} = .+" build-settings.txt)"
            else
              echo "::error::${key} is empty or unset for the Release configuration"
              fail=1
            fi
          done
          # Info.plist (BrandAppGroup) and the entitlements read $(APP_GROUP); it must be the group the
          # provisioning profile grants, or signing fails at the archive.
          echo "app group: $(grep -m1 -E '^APP_GROUP = ' build-settings.txt | sed 's/^APP_GROUP = //')"

          # --- identity OWNERSHIP -------------------------------------------------------
          # Today Release resolves to Parity's identity, by design of the inherited
          # brand.xcconfig. That is a blocker for shipping, NOT for compiling, so with
          # signing=none it is a loud warning; it is a hard error the moment anyone tries to
          # sign, because PCF must never publish under io.parity.*.
          resolved=$(grep -m1 -E '^PRODUCT_BUNDLE_IDENTIFIER = ' build-settings.txt | sed 's/^PRODUCT_BUNDLE_IDENTIFIER = //')
          echo "Release bundle identifier resolves to: ${resolved}"
          if printf '%s' "$resolved" | grep -q '^io\.parity\.'; then
            if [ "${{ inputs.signing }}" = "production" ]; then
              echo "::error::the Release configuration still resolves to a Parity bundle identifier (${resolved}); refusing to sign"
              fail=1
            else
              echo "::warning::the Release configuration resolves to Parity's bundle identifier (${resolved}) and Parity's DEVELOPMENT_TEAM. PCF must never ship under io.parity.*; check BRAND_BUNDLE_ROOT in Configs/brand.xcconfig."
            fi
          fi

          # When the production identity is known, pin it.
          expected='${{ vars.PRODUCTION_BUNDLE_ID }}'
          if [ -n "$expected" ] && [ "$resolved" != "$expected" ]; then
            echo "::error::Release resolved to '${resolved}' but the production environment expects '${expected}'"
            fail=1
          fi

          {
            echo "### Release configuration — resolved identity"
            echo ''
            echo '```'
            grep -E '^(PRODUCT_BUNDLE_IDENTIFIER|APP_MAIN_BUNDLE|APP_NAME|DEEPLINK|MARKETING_VERSION|DEVELOPMENT_TEAM|ASSETCATALOG_COMPILER_APPICON_NAME|OTHER_SWIFT_FLAGS) = ' build-settings.txt | sort -u
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit $fail

      # Shape-identical to build-dev.yml's "Build (Dev, no code signing)" step except for
      # -configuration Release. Unsigned, so it needs no Apple Developer portal registration,
      # no provisioning profile and no App Store Connect key — which is the only reason this
      # lane can run on this fork at all.
      - name: Build (Release, no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project polkadot-app.xcodeproj \
            -scheme polkadot-app \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild-production.log

      # The artifact is the evidence, not a deliverable: an unsigned .app cannot be installed
      # on a device and is not an .ipa. It exists so a human can inspect what the production
      # configuration actually produced — Info.plist identity, linked binary, bundled resources.
      - name: Collect the built product
        if: always()
        continue-on-error: true
        run: |
          set +e
          mkdir -p production-evidence
          cp build-settings.txt xcodebuild-production.log production-evidence/ 2>/dev/null

          app=$(find ~/Library/Developer/Xcode/DerivedData \
            -path '*/Build/Products/Release-iphoneos/polkadot-app.app' -type d 2>/dev/null | head -1)
          if [ -z "$app" ]; then
            echo "no Release-iphoneos polkadot-app.app found"
            exit 0
          fi
          echo "app bundle: $app"
          plutil -p "$app/Info.plist" > production-evidence/info-plist.txt 2>&1
          du -sh "$app" | tee production-evidence/bundle-size.txt
          ditto -c -k --sequesterRsrc --keepParent "$app" production-evidence/polkadot-app-Release-unsigned.zip
          ls -la production-evidence/

      # Private bucket ONLY (keyless sign-in, create and read under `ios/` only). No Actions
      # artifact, no softprops/action-gh-release, no upload_to_testflight, no firebase
      # appdistribution:distribute, no aws s3 cp.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: always()
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: always()

      - name: Upload the unsigned production build to the private bucket
        if: always()
        env:
          BUILD_BUCKET: ${{ vars.BUILD_BUCKET }}
        run: |
          set -euo pipefail
          if [ ! -d production-evidence ] || [ -z "$(ls -A production-evidence)" ]; then
            echo "::warning::no production evidence was produced"
            exit 0
          fi
          PREFIX="ios/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud storage cp --if-generation-match=0 production-evidence/* "gs://${BUILD_BUCKET}/${PREFIX}/"
          {
            echo "### Unsigned build stored privately"
            echo '```'
            echo "gs://${BUILD_BUCKET}/${PREFIX}/"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Archive, sign and upload to TestFlight for the INTERNAL group "Release Internal" only.
  # Runs after `build` has proved the Release identity, and waits for a reviewer on
  # `production-distribution`. The gate lives in the ENVIRONMENT: if it is ever deleted, GitHub
  # recreates it unprotected and this job runs straight through.
  # Signing material is read from Secret Manager at run time by an identity federated for this
  # repository in `production-distribution` only, written under $RUNNER_TEMP and removed at the end.
  sign:
    name: Sign + TestFlight (Release Internal)
    needs: build
    # !cancelled() is required: without a status function, a skipped `build` (validate mode) skips this job too.
    if: ${{ !cancelled() && (inputs.signing == 'validate' || inputs.signing == 'upload' || (inputs.signing == 'production' && needs.build.result == 'success')) }}
    runs-on: macos-15
    timeout-minutes: 120
    environment: production-distribution
    permissions:
      contents: write   # the release tag for a build that reached TestFlight; the gate is the environment
      id-token: write
    env:
      RUN_IN_CI: 'true'
      TESTFLIGHT_GROUP: Release Internal
      # The version testers see. Upstream's own MARKETING_VERSION is used when this is unset.
      MARKETING_VERSION: ${{ vars.PRODUCTION_MARKETING_VERSION }}
    steps:
      # Before any checkout or credential. INPUT_REF comes through env, never into the script text,
      # and is echoed only once it has matched the tag pattern.
      - name: Require a trusted ref
        id: trusted
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/production | refs/tags/production/*) ;;
            *)
              echo "::error::signing runs only when dispatched on the production branch or a production/* tag"
              exit 1
              ;;
          esac
          if [ -z "$INPUT_REF" ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "building the dispatched commit $GITHUB_SHA ($GITHUB_REF)"
            exit 0
          fi
          if [[ ! "$INPUT_REF" =~ ^production/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::with signing=production, ref must be empty or a production/* tag; branches and SHAs are refused"
            exit 1
          fi
          # Public repository: no credential needed. Annotated tags resolve through their peeled ^{} line.
          refs=$(git ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            "refs/tags/$INPUT_REF" "refs/tags/$INPUT_REF^{}")
          sha=$(awk -v t="refs/tags/$INPUT_REF" '$2 == t "^{}" {p = $1} $2 == t {d = $1} END {print (p != "" ? p : d)}' <<< "$refs")
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::tag $INPUT_REF does not exist"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "building tag $INPUT_REF at $sha"

      - name: Require the signing configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          IOS_SIGNING_SERVICE_ACCOUNT: ${{ vars.IOS_SIGNING_SERVICE_ACCOUNT }}
          IOS_SIGNING_SECRET: ${{ vars.IOS_SIGNING_SECRET }}
          PRODUCTION_BUNDLE_ID: ${{ vars.PRODUCTION_BUNDLE_ID }}
        run: |
          missing=''
          for name in GCP_WORKLOAD_IDENTITY_PROVIDER IOS_SIGNING_SERVICE_ACCOUNT IOS_SIGNING_SECRET PRODUCTION_BUNDLE_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing production-distribution variables:$missing"
            {
              echo "### Signing configuration missing"
              echo "Not set in the \`production-distribution\` environment:$missing"
              echo ''
              echo 'These variables are managed by the infrastructure configuration (private). See its "iOS signing" runbook.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # 10000 + run number: disjoint from the devnet lane's build numbers in the shared record.
          BUILD_NUMBER=$((10000 + GITHUB_RUN_NUMBER))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "SIGN_STARTED=$(date -u +%s)" >> "$GITHUB_ENV"
          echo "build number: $BUILD_NUMBER"

      # Exactly the commit the guard resolved; a tag moved since cannot swap it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.trusted.outputs.sha }}
          persist-credentials: false

      # The helper that holds the GCP token and the key runs from the dispatched commit only.
      - name: Check out the signing helper (dispatched commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: _trusted
          sparse-checkout: .github/scripts
          persist-credentials: false

      # Everything that needs no key runs first, so no third-party action or dependency
      # resolution runs while the key is on disk.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      # production-distribution only: no fallback to the repo-level devnet plist.
      - name: Provide GoogleService-Info.plist (production Firebase app)
        env:
          GS_PROD_B64: ${{ secrets.GOOGLESERVICE_INFO_PLIST_PROD_BASE64 }}
          PRODUCTION_BUNDLE_ID: ${{ vars.PRODUCTION_BUNDLE_ID }}
        run: |
          set -euo pipefail
          if [ -z "$GS_PROD_B64" ]; then
            echo "::error::GOOGLESERVICE_INFO_PLIST_PROD_BASE64 not set in the production-distribution environment"
            exit 1
          fi
          echo "$GS_PROD_B64" | base64 --decode > polkadot-app/GoogleService-Info.plist
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' polkadot-app/GoogleService-Info.plist 2>/dev/null || true)
          echo "Firebase plist BUNDLE_ID: ${bundle:-<none>}"
          if [ "$bundle" != "$PRODUCTION_BUNDLE_ID" ]; then
            echo "::error::Firebase plist BUNDLE_ID '${bundle:-<none>}' != PRODUCTION_BUNDLE_ID '$PRODUCTION_BUNDLE_ID'"
            exit 1
          fi

      - name: Generate build-time secrets
        env:
          MELD_BASIC_AUTH_TOKEN: ${{ secrets.MELD_BASIC_AUTH_TOKEN }}
        run: ./Runscripts/generate_secrets.sh

      # Only the archive needs packages resolved; validate skips it. Upstream's binary targets are
      # downloaded from GitHub releases, which fails often enough to be worth retrying.
      - name: Resolve SwiftPM dependencies
        if: inputs.signing == 'production'
        run: |
          for attempt in 1 2 3; do
            if xcodebuild -resolvePackageDependencies -project polkadot-app.xcodeproj -scheme polkadot-app; then
              exit 0
            fi
            echo "::warning::package resolution failed (attempt ${attempt}/3)"
            sleep $((attempt * 20))
          done
          echo "::error::could not resolve Swift package dependencies"
          exit 1

      # Isolated venv: the runner's Homebrew python refuses a global pip install.
      # Hashed lock, wheels only: nothing unpinned or built from source runs beside the key.
      - name: Install App Store Connect tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/ascenv"
          "$RUNNER_TEMP/ascenv/bin/pip" install --quiet --require-hashes --no-deps --only-binary :all: \
            -r _trusted/.github/scripts/requirements-asc.txt

      - name: Authenticate as the iOS signing identity
        id: signer-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.IOS_SIGNING_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false

      # Masks the ids, writes $RUNNER_TEMP/asc/AuthKey_<id>.p8 (0600) and exports
      # ASC_KEY_ID, ASC_ISSUER_ID, TEAM_ID and ASC_KEY_PATH to later steps.
      - name: Load the App Store Connect key
        env:
          GCP_ACCESS_TOKEN: ${{ steps.signer-auth.outputs.access_token }}
          IOS_SIGNING_SECRET: ${{ vars.IOS_SIGNING_SECRET }}
        run: |
          "$RUNNER_TEMP/ascenv/bin/python" _trusted/.github/scripts/asc_signing.py load-signing-material

      # Apple's codesign signs only from a keychain, so import the stored certificate into a throwaway one.
      # Nothing here touches the runner's default keychain, and both are discarded at the end.
      - name: Import the distribution certificate
        if: inputs.signing != 'upload'
        run: |
          set -euo pipefail
          [ -n "${P12_PATH:-}" ] || { echo "::error::no distribution certificate in the signing material"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12_PATH" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          identity=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Apple Distribution' | head -1)
          [ -n "$identity" ] || { echo "::error::no Apple Distribution identity in the imported certificate"; exit 1; }
          echo "signing identity: ${identity#*\"}"

      # Manual signing per target, the way upstream does it: xcodebuild then never contacts Apple's portal,
      # so it can neither create a certificate nor fail on the portal's flaky authentication.
      - name: Pin manual signing
        if: inputs.signing != 'upload'
        run: |
          set -euo pipefail
          for target_profile in "polkadot-app=$PROFILE_APP_NAME" "NotificationServiceExtension=$PROFILE_EXTENSION_NAME"; do
            fastlane run update_code_signing_settings \
              path:polkadot-app.xcodeproj \
              use_automatic_signing:false \
              team_id:"$TEAM_ID" \
              code_sign_identity:"Apple Distribution" \
              targets:"${target_profile%%=*}" \
              profile_name:"${target_profile#*=}" \
              build_configurations:Release
          done

      # Fails in seconds, before the archive: key accepted, app record visible, group internal.
      - name: Preflight App Store Connect
        env:
          BUNDLE_ID: ${{ vars.PRODUCTION_BUNDLE_ID }}
        run: |
          "$RUNNER_TEMP/ascenv/bin/python" _trusted/.github/scripts/asc_signing.py preflight

      # Everything that must hold before an archive is worth 25 minutes: the certificate is live at
      # Apple (not revoked), each profile embeds THAT certificate, and every entitlement the targets
      # ask for is granted. `signing: validate` stops here.
      - name: Verify the signing material
        if: inputs.signing != 'upload'
        env:
          APP_ENTITLEMENTS: polkadot-app/polkadotAppRelease.entitlements
          EXTENSION_ENTITLEMENTS: NotificationServiceExtension/NotificationServiceExtension.entitlements
        run: |
          set -euo pipefail
          BUILD_SETTINGS=$(xcodebuild -project polkadot-app.xcodeproj -scheme polkadot-app \
            -configuration Release -showBuildSettings -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile 2>/dev/null | sed -e 's/^[[:space:]]*//')
          [ -n "$BUILD_SETTINGS" ] || { echo "::error::could not read the Release build settings"; exit 1; }
          export BUILD_SETTINGS
          "$RUNNER_TEMP/ascenv/bin/python" _trusted/.github/scripts/asc_signing.py verify-signing

      - name: Signing material is ready
        if: inputs.signing == 'validate'
        run: |
          {
            echo "### Signing material verified"
            echo "Certificate live at Apple, profiles embed it, entitlements granted."
            echo "Re-run with \`signing: production\` to build, sign and upload."
          } >> "$GITHUB_STEP_SUMMARY"

      # A second identity: the build publisher, which may write under ios/ in the private bucket.
      # The signer identity may only read the secret. Acquired after the key is loaded, so the
      # credentials it writes cannot shadow the signer token.
      - name: Authenticate as the build publisher
        if: inputs.signing == 'production' || inputs.signing == 'upload'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: inputs.signing == 'production' || inputs.signing == 'upload'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Retrying an upload must not cost a rebuild: fetch the .ipa the last signed run stored.
      - name: Fetch the last signed build
        if: inputs.signing == 'upload'
        env:
          BUILD_BUCKET: ${{ vars.BUILD_BUCKET }}
        run: |
          set -euo pipefail
          latest=$(gcloud storage ls "gs://${BUILD_BUCKET}/ios/signed/**/*.ipa" | sort | tail -1)
          [ -n "$latest" ] || { echo "::error::no signed .ipa in gs://${BUILD_BUCKET}/ios/signed/"; exit 1; }
          mkdir -p build
          gcloud storage cp "$latest" build/
          echo "IPA=build/$(basename "$latest")" >> "$GITHUB_ENV"
          echo "fetched $latest"

      - name: Write ExportOptions.plist
        if: inputs.signing == 'production'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>${PRODUCTION_BUNDLE_ID}</key><string>${PROFILE_APP_NAME}</string>
              <key>${PRODUCTION_BUNDLE_ID}.NotificationServiceExtension</key><string>${PROFILE_EXTENSION_NAME}</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
        env:
          PRODUCTION_BUNDLE_ID: ${{ vars.PRODUCTION_BUNDLE_ID }}

      - name: Archive (Release)
        if: inputs.signing == 'production'
        run: |
          set -o pipefail
          xcodebuild \
            -project polkadot-app.xcodeproj \
            -scheme polkadot-app \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/polkadot-app.xcarchive \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            ${MARKETING_VERSION:+MARKETING_VERSION="$MARKETING_VERSION"} \
            archive 2>&1 | tail -n 200

      - name: Export signed .ipa
        if: inputs.signing == 'production'
        run: |
          xcodebuild -exportArchive \
            -archivePath build/polkadot-app.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/

      - name: Verify the signed .ipa identity
        if: inputs.signing == 'production'
        env:
          EXPECTED_BUNDLE_ID: ${{ vars.PRODUCTION_BUNDLE_ID }}
        run: |
          set -euo pipefail
          IPA=$(find build -maxdepth 1 -name '*.ipa' | head -1)
          [ -n "$IPA" ] || { echo "::error::no .ipa exported"; exit 1; }
          mkdir -p "$RUNNER_TEMP/ipa" && unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
          app=$(find "$RUNNER_TEMP/ipa/Payload" -maxdepth 1 -name '*.app' | head -1)
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          ver=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          num=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")
          codesign -d --entitlements :- "$app" > "$RUNNER_TEMP/entitlements.plist" 2>/dev/null
          aps=$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$RUNNER_TEMP/entitlements.plist" 2>/dev/null || echo '<none>')
          {
            echo "### Signed production build"
            echo '```'
            echo "bundle id       $id"
            echo "version         $ver ($num)"
            echo "aps-environment $aps"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ -n "$EXPECTED_BUNDLE_ID" ] || { echo "::error::PRODUCTION_BUNDLE_ID is not set in production-distribution"; exit 1; }
          [ "$id" = "$EXPECTED_BUNDLE_ID" ] || { echo "::error::signed bundle id '$id' != PRODUCTION_BUNDLE_ID '$EXPECTED_BUNDLE_ID'"; exit 1; }
          [ "$num" = "$BUILD_NUMBER" ] || { echo "::error::CFBundleVersion $num != $BUILD_NUMBER"; exit 1; }
          if [ -n "${MARKETING_VERSION:-}" ] && [ "$ver" != "$MARKETING_VERSION" ]; then
            echo "::error::CFBundleShortVersionString $ver != PRODUCTION_MARKETING_VERSION $MARKETING_VERSION"
            exit 1
          fi
          {
            echo "IPA=$IPA"
            echo "SHIPPED_VERSION=$ver"
          } >> "$GITHUB_ENV"

      # Keep the signed .ipa in the private bucket so a failed upload can be retried with
      # `signing: upload`, and so a human can inspect exactly what was signed.
      - name: Store the signed build
        if: inputs.signing == 'production'
        env:
          BUILD_BUCKET: ${{ vars.BUILD_BUCKET }}
        run: |
          set -euo pipefail
          gcloud storage cp --if-generation-match=0 "$IPA" \
            "gs://${BUILD_BUCKET}/ios/signed/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/polkadot-app-${BUILD_NUMBER}.ipa"

      # Internal group only: no --distribute_external, so no Beta App Review and no public link.
      # The API key JSON embeds the private key, so it lives beside it and goes with it.
      - name: Upload to TestFlight (internal group only)
        if: inputs.signing == 'production' || inputs.signing == 'upload'
        env:
          PRODUCTION_BUNDLE_ID: ${{ vars.PRODUCTION_BUNDLE_ID }}
        run: |
          set -euo pipefail
          api_key="$RUNNER_TEMP/asc/api_key.json"
          (
            umask 077
            jq -n \
              --arg key_id "$ASC_KEY_ID" \
              --arg issuer_id "$ASC_ISSUER_ID" \
              --rawfile key "$ASC_KEY_PATH" \
              '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: false}' \
              > "$api_key"
          )
          # --app_identifier is required: fastlane otherwise reads fastlane/Appfile, which is upstream's
          # and names Parity's bundle id.
          #
          # No --groups: Apple refuses to assign an INTERNAL group to a build ("Cannot add internal
          # group to a build"), because internal groups receive every processed build automatically.
          # Passing it made run 35816156803 fail after the build had already arrived and processed.
          # The preflight is what guards the destination: it asserts the group exists and is internal.
          fastlane pilot upload \
            --api_key_path "$api_key" \
            --app_identifier "$PRODUCTION_BUNDLE_ID" \
            --app_platform ios \
            --ipa "$IPA" \
            --distribute_external false \
            --changelog "Production (Release) build ${BUILD_NUMBER} (${GITHUB_SHA:0:7}). Internal testing only."
          BUNDLE_ID="$PRODUCTION_BUNDLE_ID" "$RUNNER_TEMP/ascenv/bin/python" \
            _trusted/.github/scripts/asc_signing.py check-distribution
          {
            echo "### TestFlight"
            echo "Uploaded build ${BUILD_NUMBER}. Internal groups, including **${TESTFLIGHT_GROUP}**, receive it automatically once processed."
          } >> "$GITHUB_STEP_SUMMARY"

      # What shipped, recorded at the commit it was built from: production/<version>-<build>, which is
      # also a ref this lane accepts, so the same build can be rebuilt verbatim. Only after Apple has
      # the build, and only in production mode - `upload` re-sends an .ipa built by an earlier run.
      - name: Tag the shipped commit
        if: inputs.signing == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.trusted.outputs.sha }}
        run: |
          set -euo pipefail
          tag="production/${SHIPPED_VERSION}-${BUILD_NUMBER}"
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .object.sha 2>/dev/null || true)
          if [ "$existing" = "$SHA" ]; then
            echo "$tag already points at $SHA"
          elif [ -n "$existing" ]; then
            echo "::error::$tag already exists at $existing, not $SHA"
            exit 1
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${tag}" -f "sha=${SHA}" --silent
            echo "tagged $SHA as $tag"
          fi
          echo "- Tagged \`${tag}\`" >> "$GITHUB_STEP_SUMMARY"

      # Automatic signing on a fresh runner creates a certificate every run; revoke the ones
      # this runner created so the team account never fills up. Runs even when signing failed.
      - name: Revoke certificates created by this runner
        if: always()
        timeout-minutes: 10
        run: |
          if [ ! -x "$RUNNER_TEMP/ascenv/bin/python" ] || [ ! -f "${ASC_KEY_PATH:-}" ] || [ -z "${SIGN_STARTED:-}" ]; then
            echo "signing material was never loaded; nothing to revoke"
            exit 0
          fi
          "$RUNNER_TEMP/ascenv/bin/python" _trusted/.github/scripts/asc_signing.py revoke-runner-certs

      - name: Remove the signing material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc"
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" 2>/dev/null
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision
          exit 0
