name: Build (Production)

# Builds the Release configuration unsigned and checks that it is the production surface (no
# environment or feature flags, complete identity). Publishes nothing: outputs go to a private
# bucket, never to Actions artifacts, because this repository is public.
#
# Environment `production` (ungated, configuration only):
#   secret GOOGLESERVICE_INFO_PLIST_PROD_BASE64  production Firebase plist; falls back to the committed placeholder
#   secret MELD_BASIC_AUTH_TOKEN                 optional; absent leaves the Meld on-ramp inert
#   var    PRODUCTION_BUNDLE_ID                  optional; asserted against the resolved bundle id
# Environment `production-distribution` (required reviewers) holds signing material and is
# declared only by the `sign` job.

on:
  workflow_dispatch:
    inputs:
      signing:
        description: 'none = unsigned build only (the only thing PCF can do today). production = requires the production-distribution environment and FAILS until PCF-29 lands.'
        type: choice
        options:
          - none
          - production
        default: none
      ref:
        description: 'Git ref to build (branch, tag or SHA). Empty = the ref this workflow was dispatched on. Lets a frozen production baseline be rebuilt later without editing this file.'
        type: string
        required: false
        default: ''

# Dispatch-only: no push, pull_request, tag or schedule trigger.

permissions:
  contents: read

concurrency:
  # Separate from the devnet lanes so neither can cancel the other.
  group: build-production-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  # Uploads to the private bucket must not use parallel composite uploads: their temporary parts live outside
  # this repository's prefix and need delete to clean up, which the build identity deliberately lacks.
  CLOUDSDK_STORAGE_PARALLEL_COMPOSITE_UPLOAD_ENABLED: "False"

jobs:
  build:
    name: Build Release (unsigned)
    runs-on: macos-15
    timeout-minutes: 90
    # Configuration only and ungated, so it runs without an approval. Signing material lives in
    # `production-distribution`, which only the `sign` job declares.
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      RUN_IN_CI: 'true'   # the project's "Copy GoogleService-Info" build phase skips when set
    steps:
      # The build and its evidence go to a private bucket. Refuse to build without one.
      - name: Require the private output configuration
        env:
          BUILD_BUCKET: ${{ vars.BUILD_BUCKET }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          missing=0
          for name in BUILD_BUCKET GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the production environment; refusing to build without a private output"
              missing=1
            fi
          done
          exit "$missing"

      # Fails before the expensive build.
      - name: Refuse a production-signed build until PCF-29 lands
        if: inputs.signing == 'production'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## `signing: production` is not available yet

          PCF holds no Apple Developer team, no App Store Connect record for a PCF bundle id,
          and no distribution certificate. Tracked by **PCF-29** (Set up Apple Dev account,
          In Progress) and **PCF-231**.

          The Apple credentials that DO exist in this repository (`APPLE_TEAM_ID`,
          `APP_STORE_CONNECT_KEY_ID`, `APP_STORE_CONNECT_ISSUER_ID`,
          `APP_STORE_CONNECT_KEY_CONTENT`) belong to the devnet TestFlight lane under Parity's
          team. They must NOT be reused for a production identity.

          What `production-distribution` needs on the day PCF-29 lands — see
          `guides/production/builds/ios.md`:
          `PRODUCTION_APPLE_TEAM_ID`, `PRODUCTION_APP_STORE_CONNECT_KEY_ID`,
          `PRODUCTION_APP_STORE_CONNECT_ISSUER_ID`, `PRODUCTION_APP_STORE_CONNECT_KEY_CONTENT`,
          and a certificate source (a PCF `match` repository plus `PRODUCTION_MATCH_PASSWORD`
          and `PRODUCTION_MATCH_RO_PAT`, or `-allowProvisioningUpdates` with the API key alone).

          Re-run with `signing: none` for an unsigned Release build.
          EOF
          echo "::error::signing=production is unavailable: PCF has no Apple team (PCF-29). Re-run with signing=none."
          exit 1

      - uses: actions/checkout@v4
        with:
          # Empty string = actions/checkout's default (the dispatched ref).
          ref: ${{ inputs.ref }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The project's copy phase is skipped while RUN_IN_CI=true, so the plist is provided here.
      - name: Provide GoogleService-Info.plist (production Firebase app)
        env:
          GS_B64: ${{ secrets.GOOGLESERVICE_INFO_PLIST_PROD_BASE64 }}
        run: |
          if [ -n "$GS_B64" ]; then
            echo "$GS_B64" | base64 --decode > polkadot-app/GoogleService-Info.plist
            echo "::notice::Firebase: using the production plist from GOOGLESERVICE_INFO_PLIST_PROD_BASE64"
          else
            cp polkadot-app/GoogleService/GoogleService-Info-Release.plist.template \
               polkadot-app/GoogleService-Info.plist
            echo "::warning::Firebase: GOOGLESERVICE_INFO_PLIST_PROD_BASE64 is not set in the 'production' environment. Falling back to the committed PLACEHOLDER template — this artifact CANNOT reach Firebase Remote Config at runtime, so it is a compile proof only. Tracked by PCF-227 / PCF-29."
          fi

      # The in-Xcode "Generate Secrets" phase is skipped while RUN_IN_CI=true, so CI runs it here.
      - name: Generate build-time secrets
        env:
          MELD_BASIC_AUTH_TOKEN: ${{ secrets.MELD_BASIC_AUTH_TOKEN }}
        run: |
          ./Runscripts/generate_secrets.sh
          if [ -z "${MELD_BASIC_AUTH_TOKEN}" ]; then
            echo "::warning::MELD_BASIC_AUTH_TOKEN is unset; the Meld fiat on-ramp is inert in this artifact (needs a Meld partner key)."
          fi

      - name: Resolve SwiftPM dependencies
        run: xcodebuild -resolvePackageDependencies -project polkadot-app.xcodeproj -scheme polkadot-app

      # Assert what Release actually resolves to (flags, icon, identity) instead of trusting the
      # xcconfig chain after an upstream sync.
      - name: Verify the Release configuration is the production surface
        run: |
          set -o pipefail
          xcodebuild \
            -project polkadot-app.xcodeproj \
            -scheme polkadot-app \
            -configuration Release \
            -showBuildSettings 2>/dev/null | sed -e 's/^[[:space:]]*//' > build-settings.txt

          fail=0

          # --- feature axis -------------------------------------------------------------
          # Release must carry no environment and no feature flag.
          for flag in -DDEV -DNIGHTLY -DUNSTABLE -DTESTNET_FEATURE -DF_DEV -DE2E_TEST \
                      -DFEATURE_DIMS -DFEATURE_DIMS_FULL -DFEATURE_PRODUCTS -DFEATURE_SIGN_IN \
                      -DFEATURE_PRIZES -DDISABLE_AUTH; do
            if grep -E '^OTHER_SWIFT_FLAGS = ' build-settings.txt | grep -qF -- "$flag"; then
              echo "::error::${flag} is set in the Release configuration — Release must carry no environment and no feature flags"
              grep -E '^OTHER_SWIFT_FLAGS = ' build-settings.txt
              fail=1
            fi
          done

          # --- icon ---------------------------------------------------------------------
          # Release ships the unsuffixed production icon.
          if grep -qxF "ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon" build-settings.txt; then
            echo "ok: ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon"
          else
            echo "::error::Release must resolve ASSETCATALOG_COMPILER_APPICON_NAME to AppIcon"
            grep -E '^ASSETCATALOG_COMPILER_APPICON_NAME = ' build-settings.txt || echo "  (setting absent entirely)"
            fail=1
          fi

          # --- identity must be complete -------------------------------------------------
          # An empty expansion builds green but traps at launch in AppConfig.Brand.
          for key in PRODUCT_BUNDLE_IDENTIFIER APP_GROUP DEEPLINK APP_NAME; do
            if grep -qE "^${key} = .+" build-settings.txt; then
              echo "ok: $(grep -m1 -E "^${key} = .+" build-settings.txt)"
            else
              echo "::error::${key} is empty or unset for the Release configuration"
              fail=1
            fi
          done

          # --- identity ownership -------------------------------------------------------
          # A Parity bundle id is a warning for an unsigned build and an error when signing.
          resolved=$(grep -m1 -E '^PRODUCT_BUNDLE_IDENTIFIER = ' build-settings.txt | sed 's/^PRODUCT_BUNDLE_IDENTIFIER = //')
          echo "Release bundle identifier resolves to: ${resolved}"
          if printf '%s' "$resolved" | grep -q '^io\.parity\.'; then
            if [ "${{ inputs.signing }}" = "production" ]; then
              echo "::error::the Release configuration still resolves to a Parity bundle identifier (${resolved}); refusing to sign"
              fail=1
            else
              echo "::warning::the Release configuration resolves to Parity's bundle identifier (${resolved}) and Parity's DEVELOPMENT_TEAM. This artifact is a COMPILE PROOF, not a shippable PCF build. Fixed by PCF-29 + a PCF value for BRAND_BUNDLE_ROOT in Configs/brand.xcconfig."
            fi
          fi

          # When the production identity is known, pin it.
          expected='${{ vars.PRODUCTION_BUNDLE_ID }}'
          if [ -n "$expected" ] && [ "$resolved" != "$expected" ]; then
            echo "::error::Release resolved to '${resolved}' but the production environment expects '${expected}'"
            fail=1
          fi

          {
            echo "### Release configuration — resolved identity"
            echo ''
            echo '```'
            grep -E '^(PRODUCT_BUNDLE_IDENTIFIER|APP_MAIN_BUNDLE|APP_GROUP|APP_NAME|DEEPLINK|MARKETING_VERSION|DEVELOPMENT_TEAM|ASSETCATALOG_COMPILER_APPICON_NAME|OTHER_SWIFT_FLAGS) = ' build-settings.txt | sort -u
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit $fail

      # Unsigned: needs no provisioning profile and no App Store Connect key.
      - name: Build (Release, no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project polkadot-app.xcodeproj \
            -scheme polkadot-app \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild-production.log

      # Evidence for inspection, not a deliverable: an unsigned .app cannot be installed.
      - name: Collect the built product
        if: always()
        continue-on-error: true
        run: |
          set +e
          mkdir -p production-evidence
          cp build-settings.txt xcodebuild-production.log production-evidence/ 2>/dev/null

          app=$(find ~/Library/Developer/Xcode/DerivedData \
            -path '*/Build/Products/Release-iphoneos/polkadot-app.app' -type d 2>/dev/null | head -1)
          if [ -z "$app" ]; then
            echo "no Release-iphoneos polkadot-app.app found"
            exit 0
          fi
          echo "app bundle: $app"
          plutil -p "$app/Info.plist" > production-evidence/info-plist.txt 2>&1
          du -sh "$app" | tee production-evidence/bundle-size.txt
          ditto -c -k --sequesterRsrc --keepParent "$app" production-evidence/polkadot-app-Release-unsigned.zip
          ls -la production-evidence/

      # Private bucket only (keyless auth; create and read under `ios/`).
      - uses: google-github-actions/auth@v3
        if: always()
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        if: always()

      - name: Upload the unsigned production build to the private bucket
        if: always()
        env:
          BUILD_BUCKET: ${{ vars.BUILD_BUCKET }}
        run: |
          set -euo pipefail
          if [ ! -d production-evidence ] || [ -z "$(ls -A production-evidence)" ]; then
            echo "::warning::no production evidence was produced"
            exit 0
          fi
          PREFIX="ios/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud storage cp --if-generation-match=0 production-evidence/* "gs://${BUILD_BUCKET}/${PREFIX}/"
          {
            echo "### Unsigned build stored privately"
            echo '```'
            echo "gs://${BUILD_BUCKET}/${PREFIX}/"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # `production-distribution` must have required reviewers configured: GitHub creates a missing
  # environment unprotected on first use.
  sign:
    name: Sign for production (blocked on PCF-29)
    needs: build
    if: inputs.signing == 'production'
    runs-on: macos-15
    timeout-minutes: 60
    environment: production-distribution
    steps:
      - name: Assert the production signing material is present
        env:
          TEAM_ID: ${{ secrets.PRODUCTION_APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.PRODUCTION_APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.PRODUCTION_APP_STORE_CONNECT_ISSUER_ID }}
          KEY_B64: ${{ secrets.PRODUCTION_APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          missing=''
          [ -n "$TEAM_ID" ]   || missing="$missing PRODUCTION_APPLE_TEAM_ID"
          [ -n "$KEY_ID" ]    || missing="$missing PRODUCTION_APP_STORE_CONNECT_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing PRODUCTION_APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$KEY_B64" ]   || missing="$missing PRODUCTION_APP_STORE_CONNECT_KEY_CONTENT"
          if [ -n "$missing" ]; then
            echo "::error::missing in the production-distribution environment:$missing (PCF-29)"
            exit 1
          fi
          echo "all four App Store Connect inputs are present"

      - name: Not implemented
        run: |
          echo "::error::production signing is not implemented; see guides/production/builds/ios.md"
          exit 1
