name: PR Summary Report

# PCF production branch: upstream workflow kept with ONLY the workflow_dispatch trigger (upstream's
# pull_request / schedule triggers removed) so nothing publishes or mutates the repository unattended.
# The jobs are upstream's, unchanged. Production builds come from build-production.yml.
on:
  workflow_dispatch:
    inputs:
      days:
        description: Number of days to look back for merged PRs
        required: false
        default: 30
        type: number

jobs:
  pr-summary:
    uses: novasamatech/github-actions/.github/workflows/pr-summary-report.yml@v5
    with:
      days: ${{ fromJSON(github.event.inputs.days || '30') }}
    secrets: inherit
